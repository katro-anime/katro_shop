<!DOCTYPE html><html dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title>
<style>body{background:#0f0f14;color:#fff;font-family:sans-serif;padding:12px}.card{background:#1e1e2e;padding:12px;border-radius:12px;margin:10px 0}button{border:none;padding:8px 12px;border-radius:8px;margin:4px;font-weight:700;cursor:pointer}.ok{background:#ffcc00}.done{background:#00ff88}.bad{background:#ff3b3b;color:#fff}</style></head><body>
<script>let p="0100454995mm"; if(prompt("🔒 كلمة سر الادمن")!==p){alert("غلط");location.href="index.html"}</script>
<h2>لوحة تحكم كاترو شوب PRO</h2><div id="pend"></div><h3>الطلبات</h3><div id="ords"></div>
<script>
let pe=JSON.parse(localStorage.getItem('pending')||'[]'); document.getElementById('pend').innerHTML='<h4>اشعارات الشحن</h4>'+pe.map((x,i)=>`<div class=card>${x.amount}ج - ${x.date}<br><button class=ok onclick="approve(${i},${x.amount})">✅ موافق</button><button class=bad onclick="reject(${i})">❌ مزور/ملغي</button></div>`).join('')||'لا يوجد';
function approve(i,a){let w=parseInt(localStorage.getItem('wallet')||0)+parseInt(a);localStorage.setItem('wallet',w);pe.splice(i,1);localStorage.setItem('pending',JSON.stringify(pe));location.reload()}
function reject(i){if(confirm('حذف الاشعار المزور؟')){pe.splice(i,1);localStorage.setItem('pending',JSON.stringify(pe));location.reload()}}
let o=JSON.parse(localStorage.getItem('orders')||'[]'); document.getElementById('ords').innerHTML=o.map((x,i)=>`<div class=card>${x.pack} - ${x.price}ج - ID:${x.id}<br>الحالة: ${x.status}<br><button class=done onclick="done(${i})">✅ مكتمل</button><button class=bad onclick="cancelO(${i})">❌ ملغي ID غلط + ارجاع</button></div>`).join('')||'لا يوجد';
function done(i){o[i].status='مكتمل';localStorage.setItem('orders',JSON.stringify(o));location.reload()}
function cancelO(i){let w=parseInt(localStorage.getItem('wallet')||0)+parseInt(o[i].price);localStorage.setItem('wallet',w);o[i].status='ملغي - ID غلط';localStorage.setItem('orders',JSON.stringify(o));location.reload()}
</script></body></html>
