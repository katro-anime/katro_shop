<!DOCTYPE html>
<html dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>محفظتي - كاترو شوب</title>
<style>
body{margin:0;font-family:sans-serif;background:#f5f5f5}
.header{background:#6a3de8;color:#fff;padding:10px 15px;display:flex;justify-content:space-between;align-items:center}
.card{margin:15px;background:linear-gradient(135deg,#e0f8e0,#fff);padding:20px;border-radius:15px;text-align:right}
.card h2{margin:0;color:#333}
.card .bal{color:#ff7a00;font-size:28px;font-weight:bold;margin:10px 0}
.btns{background:#fff;margin:15px;border-radius:15px;overflow:hidden}
.btns div{padding:15px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.bottom-nav{position:fixed;bottom:10px;left:10px;right:10px;background:#1a1a2e;border-radius:20px;display:flex;justify-content:space-around;padding:10px;color:#fff}
.bottom-nav a{color:#fff;text-decoration:none;font-size:12px;text-align:center}
.active{color:#a56eff !important}
.badge{background:#6a3de8;color:#fff;padding:8px 20px;border-radius:20px;text-align:center;margin:10px auto;width:fit-content}
</style></head><body>
<div class="header"><span>☰</span><b>ALHBANI SHOP</b><span>🛒</span></div>
<div class="badge">رقم حسابك: 69058</div>

<div class="card">
<div style="text-align:right">💳 محفظتي</div>
<div class="bal" id="bal">0.00 ج.س</div>
</div>

<div class="btns">
<div onclick="location.href='wallet-topup.html'">شحن المحفظة <span>⊕</span></div>
<div>تحويل الرصيد <span>⇄</span></div>
<div>سجل المعاملات <span>📄</span></div>
</div>

<div style="margin:15px;background:#e8f5e9;padding:15px;border-radius:15px">
<h3>لوحة المحفظة</h3>
<p>لا توجد معاملات</p>
<div id="orders"></div>
</div>

<div class="bottom-nav">
<a href="index.html">الرئيسية</a>
<a class="active" href="wallet.html">المحفظة</a>
<a href="#">الطلبات</a>
<a href="#">حسابي</a>
</div>

<script>
let w=localStorage.getItem('wallet')||0;
document.getElementById('bal').innerText=w+'.00 ج.س';
let orders=JSON.parse(localStorage.getItem('orders')||'[]');
let html='';
orders.forEach(o=>{html+=`<div style="padding:8px;border-bottom:1px solid #ccc">${o.pack} - ${o.price}ج - ID:${o.id} - الحالة: <b>${o.status}</b></div>`});
document.getElementById('orders').innerHTML=html;
</script>
</body></html>
