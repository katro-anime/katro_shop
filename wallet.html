<style>

@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap');

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:'Tajawal',sans-serif;
}

body{

.top{

    justify-content:space-between;

    position:sticky;

}

.logo{
    color:#5723c9;

    font-weight:900;
}

.top a{
    width:46px;
    height:46px;

    background:#5723c9;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    font-size:22px;
}

.container{
    max-width:650px;
    margin:auto;
    padding:15px;
}

.hero{
    background:linear-gradient(135deg,#762bd7,#ff7b21);
    color:#fff;
    border-radius:25px;
    padding:23px;
    margin-bottom:15px;
    box-shadow:0 8px 25px rgba(100,40,200,.18);
}

.greet{

    font-weight:900;
}

.small{

}

.wallet-number{
    display:inline-block;
    margin-top:14px;
    background:rgba(255,255,255,.18);
    padding:9px 16px;
    border-radius:13px;
    font-weight:900;
}

.card{
    background:#fff;
    border-radius:22px;
    padding:18px;
    margin-bottom:15px;
    box-shadow:0 4px 18px rgba(0,0,0,.06);
}

.section-title{
    font-size:19px;
    font-weight:900;
    margin-bottom:13px;
}

.balance{
    background:linear-gradient(135deg,#e8fff2,#f4f9ff);
    border-radius:18px;
    padding:22px;
    text-align:center;
    border:1px solid #e0eee5;
}

.balance-title{
    color:#777;
    font-size:13px;
}

.balance-value{
    display:block;
    margin-top:7px;
    color:#16833c;
    font-size:32px;
    font-weight:900;
}

.btn{
    width:100%;
    border:none;
    padding:14px;
    border-radius:15px;
    margin-top:10px;
    font-weight:900;
    font-size:14px;
    cursor:pointer;
}

.primary{
    color:#fff;
    background:linear-gradient(90deg,#7024d9,#ff7b21);
}

.secondary{
    color:#5723c9;
    background:#f0eaff;
}

.logout{
    color:#c62828;
    background:#ffebee;
}

.item{
    background:#fafafa;
    border:1px solid #eee;
    border-radius:15px;
    padding:13px;
    margin-top:10px;
    line-height:1.9;
    font-size:13px;
}

.status{
    display:inline-block;
    padding:3px 9px;
    border-radius:10px;
    color:#fff;
    background:#ff9800;
    font-size:11px;
}

.status.completed{
    background:#00a843;
}

.status.rejected{
    background:#d50000;
}

.status.processing{
    background:#1976d2;
}

.empty{
    text-align:center;
    color:#888;
    padding:18px 5px;
}

.loading{
    text-align:center;
    padding:50px;
    color:#666;
}

.error{
    background:#ffebee;
    color:#c62828;
    padding:13px;
    margin:15px;
    border-radius:13px;
    text-align:center;
    display:none;
}

/* واتساب */

.whatsapp{
    position:fixed;
    right:18px;
    bottom:88px;
    width:58px;
    height:58px;
    border-radius:50%;
    background:#25D366;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    font-size:31px;
    z-index:999;
    box-shadow:0 5px 20px rgba(0,0,0,.25);
}

/* الشريط السفلي */

.bottom{
    position:fixed;
    bottom:10px;
    left:10px;
    right:10px;
    height:64px;
    background:#16112e;
    border-radius:32px;
    display:flex;
    justify-content:space-around;
    align-items:center;
    z-index:900;
    box-shadow:0 5px 20px rgba(0,0,0,.25);
}

.bottom a{
    text-decoration:none;
    color:#9995b1;
    text-align:center;
    font-size:10px;
}

.bottom a.active{
    color:#b987ff;
}

.icon{
    display:block;
    font-size:21px;
    margin-bottom:2px;
}

</style>

</head>

<body>

<!-- HEADER -->

<div class="top">

    <div class="logo">
        KATRO SHOP
    </div>

    <a href="index.html">
        🏠
    </a>

</div>


<div id="loading" class="loading">
    جاري تحميل بيانات محفظتك...
</div>


<div id="errorBox" class="error"></div>


<div id="content"
     class="container"
     style="display:none">


    <!-- الترحيب -->

    <div class="hero">

        <div
            class="greet"
            id="greet">

            مرحباً 👋

        </div>

        <div class="small">
            رقم محفظتك الخاص
        </div>

        <div class="wallet-number">

            <span id="walletNumber">
                -----
            </span>

        </div>

    </div>


    <!-- المحفظة -->

    <div class="card">

        <div class="section-title">
            💳 محفظتي
        </div>


        <div class="balance">

            <div class="balance-title">
                رصيد محفظتك الحالي
            </div>

            <span
                id="balance"
                class="balance-value">

                0 ج.س

            </span>

        </div>


        <button
            class="btn primary"
            onclick="location.href='wallet-topup.html'">

            💰 شحن المحفظة

        </button>


        <button
            class="btn secondary"
            onclick="loadAllData()">

            🔄 تحديث الرصيد

        </button>

    </div>


    <!-- طلبات الشحن -->

    <div class="card">

        <div class="section-title">
            📋 طلبات شحن المحفظة
        </div>

        <div id="topupsList">

            <div class="empty">
                لا توجد طلبات شحن حتى الآن
            </div>

        </div>

    </div>


    <!-- الطلبات -->

    <div class="card">

        <div class="section-title">
            🛒 طلباتي
        </div>

        <div id="ordersList">

            <div class="empty">
                لا توجد طلبات حتى الآن
            </div>

        </div>

    </div>


    <!-- بيانات الحساب -->

    <div class="card">

        <div class="section-title">
            👤 بيانات الحساب
        </div>

        <div class="item">

            <b>الاسم:</b>
            <span id="fullName">-</span>

            <br>

            <b>البريد:</b>
            <span id="email">-</span>

            <br>

            <b>الهاتف:</b>
            <span id="phone">-</span>

        </div>


        <button
            class="btn logout"
            onclick="logout()">

            🚪 تسجيل الخروج

        </button>

    </div>

</div>


<!-- واتساب -->

<!-- غير الرقم هنا إلى رقمك -->

<a
    class="whatsapp"
    href="https://wa.me/249XXXXXXXXX"
    target="_blank">

    ☎

</a>


<!-- الشريط السفلي -->

<div class="bottom">

    <a href="login.html">

        <span class="icon">👤</span>
        حسابي

    </a>

    <a href="#orders">

        <span class="icon">🧾</span>
        الطلبات

    </a>

    <a
        class="active"
        href="wallet.html">

        <span class="icon">💳</span>
        المحفظة

    </a>

    <a href="index.html">

        <span class="icon">🏠</span>
        الرئيسية

    </a>

</div>


<script>

/* ================= SUPABASE ================= */

const SUPABASE_URL =
'https://uwmrzvsygeoequscpinx.supabase.co';

const SUPABASE_PUBLISHABLE_KEY =
'sb_publishable_26b3KZpWkLqltiLTyTSpIg_gTgexDts';

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);


/* ================= MONEY ================= */

function formatMoney(value){

    return Number(value || 0)
        .toLocaleString('ar-EG') +
        ' ج.س';

}


/* ================= ERROR ================= */

function showError(message){

    document.getElementById('loading')
        .style.display='none';

    const box =
        document.getElementById('errorBox');

    box.innerText=message;

    box.style.display='block';

}


/* ================= LOAD ================= */

async function loadAllData(){

    document.getElementById('errorBox')
        .style.display='none';

    try{

        const {
            data:sessionData,
            error:sessionError
        } =
        await supabaseClient.auth.getSession();


        if(sessionError){

            showError(
                'حدث خطأ أثناء التحقق من تسجيل الدخول.'
            );

            return;
        }


        const session =
            sessionData.session;


        if(!session){

            location.href='login.html';

            return;
        }


        const user =
            session.user;


        /* PROFILE */

        const {
            data:profile,
            error:profileError
        } =
        await supabaseClient
        .from('profiles')
        .select(
            'full_name,phone,wallet_number,role'
        )
        .eq('id',user.id)
        .single();


        if(profileError){

            console.error(profileError);

            showError(
                'لم نستطع تحميل بيانات المحفظة.'
            );

            return;
        }


        /* WALLET */

        const {
            data:wallet,
            error:walletError
        } =
        await supabaseClient
        .from('wallets')
        .select('balance,updated_at')
        .eq('user_id',user.id)
        .single();


        if(walletError){

            console.error(walletError);

            showError(
                'لم نستطع تحميل رصيد المحفظة.'
            );

            return;
        }


        const name =
            profile.full_name ||
            'عميل KATRO';


        document.getElementById('greet')
            .innerText =
            'مرحباً يا '+
            name+
            ' 👋';


        document.getElementById('walletNumber')
            .innerText =
            profile.wallet_number || '-----';


        document.getElementById('balance')
            .innerText =
            formatMoney(wallet.balance);


        document.getElementById('fullName')
            .innerText =
            name;


        document.getElementById('email')
            .innerText =
            user.email || '-';


        document.getElementById('phone')
            .innerText =
            profile.phone || '-';


        await loadTopups(user.id);

        await loadOrders(user.id);

        await loadTransactions(user.id);


        document.getElementById('loading')
            .style.display='none';

        document.getElementById('content')
            .style.display='block';


    }catch(error){

        console.error(error);

        showError(
            'حدث خطأ غير متوقع. أعد تحميل الصفحة.'
        );

    }

}


/* ================= TOPUPS ================= */

async function loadTopups(userId){

    const box =
        document.getElementById('topupsList');


    const {
        data,
        error
    } =
    await supabaseClient
    .from('topup_requests')
    .select(
        'id,request_number,amount,payment_method,sender_name,sender_phone,status,admin_note,created_at'
    )
    .eq('user_id',userId)
    .order(
        'created_at',
        {ascending:false}
    )
    .limit(10);


    if(error){

        console.error(error);

        box.innerHTML=
        '<div class="empty">تعذر تحميل طلبات الشحن</div>';

        return;
    }


    if(!data || !data.length){

        box.innerHTML=
        '<div class="empty">لا توجد طلبات شحن حتى الآن</div>';

        return;
    }


    let html='';


    data.forEach(function(item){

        let statusClass='';

        let statusText='قيد المراجعة ⏳';


        if(item.status==='approved'){

            statusClass='completed';

            statusText='تم القبول ✅';

        }


        if(item.status==='rejected'){

            statusClass='rejected';

            statusText='مرفوض ❌';

        }


        const date =
            new Date(item.created_at)
            .toLocaleString('ar-EG');


        html+=`

        <div class="item">

            <b>
                طلب شحن #${item.request_number || item.id}
            </b>

            <br>

            المبلغ:
            <b>${formatMoney(item.amount)}</b>

            <br>

            البنك:
            ${escapeHtml(item.payment_method || 'Bankak')}

            <br>

            التاريخ:
            ${date}

            <br>

            الحالة:

            <span class="status ${statusClass}">
                ${statusText}
            </span>

            ${
                item.admin_note
                ?
                `<br><b>ملاحظة الأدمن:</b>
                ${escapeHtml(item.admin_note)}`
                :
                ''
            }

        </div>

        `;

    });


    box.innerHTML=html;

}


/* ================= ORDERS ================= */

async function loadOrders(userId){

    const box =
        document.getElementById('ordersList');


    const {
        data,
        error
    } =
    await supabaseClient
    .from('orders')
    .select(
        'id,order_number,product_name,total_price,quantity,player_id,account_info,status,admin_note,created_at'
    )
    .eq('user_id',userId)
    .order(
        'created_at',
        {ascending:false}
    )
    .limit(10);


    if(error){

        console.error(error);

        box.innerHTML=
        '<div class="empty">تعذر تحميل الطلبات</div>';

        return;
    }


    if(!data || !data.length){

        box.innerHTML=
        '<div class="empty">لا توجد طلبات حتى الآن</div>';

        return;
    }


    let html='';


    data.forEach(function(item){

        let statusClass='';

        let statusText='قيد الانتظار ⏳';


        if(item.status==='completed'){

            statusClass='completed';

            statusText='مكتمل ✅';

        }


        if(item.status==='processing'){

            statusClass='processing';

            statusText='جاري التنفيذ 🔄';

        }


        if(
            item.status==='rejected' ||
            item.status==='cancelled'
        ){

            statusClass='rejected';

            statusText='ملغي ❌';

        }


        const date =
            new Date(item.created_at)
            .toLocaleString('ar-EG');


        html+=`

        <div class="item">

            <b>
                طلب #${item.order_number || item.id}
            </b>

            <br>

            المنتج:
            ${escapeHtml(item.product_name)}

            <br>

            الكمية:
            ${item.quantity || 1}

            <br>

            الإجمالي:
            <b>${formatMoney(item.total_price)}</b>

            ${
                item.player_id
                ?
                `<br>معرف اللاعب:
                ${escapeHtml(item.player_id)}`
                :
                ''
            }

            <br>

            التاريخ:
            ${date}

            <br>

            الحالة:

            <span class="status ${statusClass}">
                ${statusText}
            </span>

        </div>

        `;

    });


    box.innerHTML=html;

}


/* ================= TRANSACTIONS ================= */

async function loadTransactions(userId){

    const {
        data,
        error
    } =
    await supabaseClient
    .from('wallet_transactions')
    .select(
        'id,type,amount,balance_before,balance_after,description,created_at'
    )
    .eq('user_id',userId)
    .order(
        'created_at',
        {ascending:false}
    )
    .limit(10);


    if(error){

        console.error(error);

        return;
    }


    if(!data || !data.length){

        return;
    }


    const card =
        document.createElement('div');

    card.className='card';


    let html=
        '<div class="section-title">💰 آخر معاملات المحفظة</div>';


    data.forEach(function(item){

        const isTopup =
            item.type==='topup';

        const sign =
            isTopup ? '+' : '-';


        const date =
            new Date(item.created_at)
            .toLocaleString('ar-EG');


        html+=`

        <div class="item">

            <b>
                ${escapeHtml(
                    item.description ||
                    (isTopup ?
                    'شحن محفظة':
                    'شراء')
                )}
            </b>

            <br>

            المبلغ:

            <b style="
                color:${isTopup ?
                '#16833c':
                '#c62828'};
            ">

                ${sign}${formatMoney(item.amount)}

            </b>

            <br>

            الرصيد بعد العملية:

            <b>
                ${formatMoney(item.balance_after)}
            </b>

            <br>

            ${date}

        </div>

        `;

    });


    card.innerHTML=html;


    document.getElementById('content')
        .appendChild(card);

}


/* ================= ESCAPE ================= */

function escapeHtml(value){

    if(value===null ||
       value===undefined){

        return '';

    }

    return String(value)
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;')
        .replace(/'/g,'&#039;');

}


/* ================= LOGOUT ================= */

async function logout(){

    if(!confirm('هل تريد تسجيل الخروج؟')){

        return;
    }


    const {error} =
        await supabaseClient.auth.signOut();


    if(error){

        alert(
            'حدث خطأ أثناء تسجيل الخروج.'
        );

        return;
    }


    location.href='login.html';

}


/* ================= AUTH ================= */

supabaseClient.auth.onAuthStateChange(
    function(event){

        if(event==='SIGNED_OUT'){

            location.href='login.html';

        }

    }
);


loadAllData();

</script>

</body>
            </html>
