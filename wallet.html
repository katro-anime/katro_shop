<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Tahoma,sans-serif;
    background:#f5f6f8;
    color:#151515;
    padding-bottom:100px;
}

/* HEADER */

.header{
    height:70px;
    background:#080b12;
    color:white;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    position:sticky;
    top:0;
    z-index:1000;
}

.logo{
    font-size:22px;
    font-weight:bold;
}

.menu-btn{
    width:45px;
    height:45px;
    border-radius:50%;
    border:0;
    background:#151c2b;
    color:white;
    font-size:23px;
}

/* CONTAINER */

.container{
    max-width:650px;
    margin:auto;
    padding:18px;
}

/* TITLE */

.page-title{
    font-size:26px;
    font-weight:bold;
    margin:10px 0 20px;
}

/* USER CARD */

.user-card{
    background:linear-gradient(
        135deg,
        #743cff,
        #ff6b35
    );
    color:white;
    border-radius:25px;
    padding:24px;
    margin-bottom:18px;
    box-shadow:0 10px 30px rgba(0,0,0,.12);
}

.user-name{
    font-size:21px;
    font-weight:bold;
}

.wallet-number{
    margin-top:8px;
    opacity:.9;
}

/* BALANCE */

.balance-card{
    background:white;
    border-radius:22px;
    padding:25px;
    text-align:center;
    box-shadow:0 5px 25px rgba(0,0,0,.06);
    margin-bottom:18px;
}

.balance-title{
    color:#777;
    margin-bottom:10px;
}

.balance{
    font-size:32px;
    font-weight:bold;
    color:#00a86b;
}

/* ACTIONS */

.actions{
    background:white;
    border-radius:25px;
    padding:12px;
    box-shadow:0 5px 25px rgba(0,0,0,.06);
}

.wallet-action{
    display:flex;
    align-items:center;
    justify-content:space-between;
    text-decoration:none;
    color:#222;
    background:white;
    border:1px solid #eee;
    border-radius:18px;
    padding:18px;
    margin:10px 0;
    font-size:19px;
    font-weight:bold;
    transition:.2s;
}

.wallet-action:hover{
    transform:translateY(-2px);
}

.wallet-action-right{
    display:flex;
    align-items:center;
    gap:15px;
}

.wallet-action-icon{
    width:50px;
    height:50px;
    border-radius:15px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#e7f9ef;
    color:#00a86b;
    font-size:25px;
}

.arrow{
    color:#aaa;
    font-size:25px;
}

/* TRANSACTIONS */

.section{
    background:white;
    border-radius:22px;
    margin-top:20px;
    overflow:hidden;
    box-shadow:0 5px 25px rgba(0,0,0,.06);
}

.section-title{
    padding:20px;
    font-size:22px;
    font-weight:bold;
    border-bottom:1px solid #eee;
}

.transaction{
    padding:17px 20px;
    border-bottom:1px solid #eee;
}

.transaction:last-child{
    border-bottom:0;
}

.transaction-top{
    display:flex;
    justify-content:space-between;
    gap:10px;
}

.transaction-description{
    font-weight:bold;
}

.transaction-date{
    color:#999;
    font-size:13px;
    margin-top:7px;
}

.transaction-in{
    color:#00a86b;
    font-weight:bold;
}

.transaction-out{
    color:#d62828;
    font-weight:bold;
}

.empty{
    padding:25px;
    text-align:center;
    color:#888;
}

/* BOTTOM NAV */

.bottom-nav{
    position:fixed;
    bottom:10px;
    left:14px;
    right:14px;
    height:72px;
    background:#0b081b;
    border-radius:28px;
    display:flex;
    justify-content:space-around;
    align-items:center;
    z-index:9998;
    box-shadow:0 8px 30px rgba(0,0,0,.25);
}

.nav-item{
    color:#aaa;
    text-decoration:none;
    text-align:center;
    font-size:12px;
    min-width:70px;
}

.nav-icon{
    display:block;
    font-size:24px;
    margin-bottom:4px;
}

.nav-item.active{
    color:#a855f7;
}

/* WHATSAPP */

.whatsapp-float{
    position:fixed;
    left:18px;
    bottom:95px;
    width:62px;
    height:62px;
    border-radius:50%;
    background:#25D366;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 5px 20px rgba(0,0,0,.25);
    z-index:9999;
    text-decoration:none;
}

.whatsapp-float svg{
    width:38px;
    height:38px;
    fill:white;
}

/* LOADING */

.loading{
    text-align:center;
    padding:30px;
    color:#777;
}

<script>

const SUPABASE_URL =
"https://uwmrzvsygeoequscpinx.supabase.co";

const SUPABASE_KEY =
"sb_publishable_26b3KZpWkLqltiLTyTSpIg_gTgexDts";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


let currentUser = null;


async function init(){

    const {
        data:{
            user
        }
    } =
    await supabaseClient.auth.getUser();

    if(!user){

        window.location.href =
        "login.html";

        return;
    }

    currentUser = user;

    await loadProfile();
    await loadBalance();
    await loadTransactions();

}


async function loadProfile(){

    const {
        data,
        error
    } =
    await supabaseClient
    .from("profiles")
    .select(
        "full_name,phone,wallet_number"
    )
    .eq(
        "user_id",
        currentUser.id
    )
    .limit(1);

    if(error){
        console.error(error);
        return;
    }

    if(!data || !data.length){
        return;
    }

    const profile = data[0];

    document.getElementById(
        "userName"
    ).textContent =
    profile.full_name ||
    "مرحباً بك";

    document.getElementById(
        "walletNumber"
    ).textContent =
    "رقم المحفظة: " +
    (
        profile.wallet_number ||
        "غير متوفر"
    );

}


async function loadBalance(){

    const {
        data,
        error
    } =
    await supabaseClient
    .from("wallets")
    .select("balance")
    .eq(
        "user_id",
        currentUser.id
    )
    .limit(1);

    if(error){

        document.getElementById(
            "balance"
        ).textContent =
        "تعذر تحميل الرصيد";

        return;
    }

    const amount =
    Number(
        data?.[0]?.balance || 0
    );

    document.getElementById(
        "balance"
    ).textContent =
    amount.toLocaleString("ar-EG")
    + " ج.س";

}


async function loadTransactions(){

    const box =
    document.getElementById(
        "transactionsList"
    );

    const {
        data,
        error
    } =
    await supabaseClient
    .from("wallet_transactions")
    .select(
        "id,type,amount,balance_before,balance_after,description,created_at"
    )
    .eq(
        "user_id",
        currentUser.id
    )
    .order(
        "created_at",
        {
            ascending:false
        }
    )
    .limit(50);


    if(error){

        console.error(error);

        box.innerHTML =
        `<div class="empty">
        تعذر تحميل سجل المعاملات
        </div>`;

        return;
    }


    if(!data || !data.length){

        box.innerHTML =
        `<div class="empty">
        لا توجد معاملات
        </div>`;

        return;
    }


    box.innerHTML = "";


    data.forEach(transaction => {

        const amount =
        Number(transaction.amount || 0);

        const isIn =
        transaction.type ===
        "transfer_in"
        ||
        amount > 0;

        const date =
        new Date(
            transaction.created_at
        ).toLocaleString(
            "ar-EG"
        );


        const item =
        document.createElement("div");

        item.className =
        "transaction";


        item.innerHTML = `

            <div class="transaction-top">

                <div class="transaction-description">
                    ${escapeHtml(
                        transaction.description ||
                        getTransactionName(
                            transaction.type
                        )
                    )}
                </div>

                <div class="${
                    isIn
                    ? "transaction-in"
                    : "transaction-out"
                }">

                    ${
                        isIn ? "+" : ""
                    }

                    ${Math.abs(amount)
                        .toLocaleString("ar-EG")
                    }

                    ج.س

                </div>

            </div>

            <div class="transaction-date">

                ${date}

            </div>
        `;


        box.appendChild(item);

    });

}


function getTransactionName(type){

    if(type === "transfer_in"){
        return "تحويل وارد";
    }

    if(type === "transfer_out"){
        return "تحويل صادر";
    }

    return "معاملة مالية";
}


function escapeHtml(value){

    return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


init();

</script>
