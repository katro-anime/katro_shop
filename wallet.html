<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>محفظتي - KATRO</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@700;800&display=swap');
*{font-family:'Tajawal';box-sizing:border-box;margin:0}body{background:#f4f0ff;padding-bottom:90px}
.top{background:#6a33ff;color:#fff;padding:12px;display:flex;justify-content:space-between}
.card{background:#fff;margin:12px;border-radius:18px;padding:16px;box-shadow:0 4px 14px #0001}
.green{background:#e8f5e9;border-radius:14px;padding:16px;text-align:center;margin:10px 0}
.badge{background:#c69c3a;color:#fff;padding:6px 14px;border-radius:20px;font-size:13px;display:inline-block;font-weight:800}
.btn{width:100%;background:linear-gradient(90deg,#6a33ff,#ff8a00);color:#fff;border:none;padding:13px;border-radius:12px;font-weight:800;margin-top:8px}
.bottom{position:fixed;bottom:10px;left:10px;right:10px;height:62px;background:#16112e;border-radius:30px;display:flex;justify-content:space-around;align-items:center}
.bottom a{color:#8d8da6;text-decoration:none;font-size:10px;display:flex;flex-direction:column;align-items:center}.bottom a.active{color:#bda7ff}
</style></head><body>
<div class="top"><b>KATRO SHOP</b><span>MY ACCOUNT</span></div>

<div class="card" style="background:linear-gradient(135deg,#7c4dff,#ff8a00);color:#fff">
<div id="greet">مساء الخير 👋</div>
<small>رقم محفظتك الخاص</small>
</div>

<div class="card">
<div class="badge">رقم حسابك: <span id="accNum">-----</span></div>
<h3 style="margin-top:10px">محفظتي</h3>
<div class="green">
<b>رصيد محفظتك هو</b><br>
<span id="bal" style="font-size:30px;font-weight:900">0.00 ج.س</span>
</div>
<button class="btn" onclick="location.href='wallet-topup.html'">تحويل الرصيد + شحن المحفظة</button>
<button class="btn" style="background:#f0eaff;color:#333" onclick="showOrders()">سجل المعاملات و الطلبات</button>
</div>

<div class="card" id="ordersBox">
<h3>طلباتي</h3>
<div id="ordersList">لا يوجد طلبات بعد</div>
</div>

<div class="bottom">
<a href="login.html"><div>👤</div>دخول</a>
<a href="wallet.html"><div>🧾</div>الطلبات</a>
<a class="active"><div>💳</div>المحفظة</a>
<a href="index.html"><div>🏠</div>الرئيسية</a>
</div>

<script>
let acc = localStorage.getItem('user_acc') || Math.floor(10000+Math.random()*89999);
if(!localStorage.getItem('user_acc')){localStorage.setItem('user_acc',acc)}
document.getElementById('accNum').innerText=acc;
let email=localStorage.getItem('user_email')||'زائر';
document.getElementById('greet').innerText='مساء الخير يا '+email+' 👋';
document.getElementById('bal').innerText=(localStorage.getItem('wallet')||0)+'.00 ج.س';

function showOrders(){
let pend=JSON.parse(localStorage.getItem('pending')||'[]');
let html='';
pend.reverse().forEach(o=>{
html+=`<div style="border:1px dashed #6a33ff;border-radius:10px;padding:10px;margin:8px 0;background:#faf5ff">
<b>طلب #${o.id}</b><br>
<small>${o.date}</small><br>
الإجمالي: <b>${o.amount} ج.س</b><br>
الحالة: <span style="background:orange;color:#fff;padding:2px 8px;border-radius:10px;font-size:11px">${o.status}</span><br>
محول إلى: بنكك ${o.bankAcc}
</div>`;
});
document.getElementById('ordersList').innerHTML=html||'لا يوجد طلبات';
}
showOrders();
</script>
</body></html>
