<style>

/* =========================
   RESET
========================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:
        Arial,
        Tahoma,
        sans-serif;

    background:#f5f6f8;

    color:#151515;

    min-height:100vh;

    padding-bottom:105px;
}


/* =========================
   HEADER
========================= */

.header{

    height:72px;

    background:#080b12;

    color:white;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 20px;
}

.logo{

    font-size:23px;

    font-weight:bold;

    letter-spacing:.5px;
}

.home-btn{

    width:48px;

    height:48px;

    border-radius:50%;

    background:#151c2b;

    color:white;

    display:flex;

    align-items:center;

    justify-content:center;

    text-decoration:none;

    font-size:27px;

    transition:.2s;
}

.home-btn:active{

    transform:scale(.92);
}


/* =========================
   CONTAINER
========================= */

.container{

    width:100%;

    max-width:650px;

    margin:auto;

    padding:22px 18px 40px;
}


/* =========================
   PAGE TITLE
========================= */

.page-title{

    font-size:32px;

    font-weight:bold;

    margin:5px 0 25px;

    text-align:right;
}


/* =========================
   USER CARD
========================= */

.user-card{

    background:
        linear-gradient(
            135deg,
            #7138ff,
            #ff6840
        );

    color:white;

    border-radius:28px;

    padding:28px 25px;

    margin-bottom:18px;

    box-shadow:
        0 10px 30px
        rgba(0,0,0,.12);
}

.user-name{

    font-size:25px;

    font-weight:bold;

    margin-bottom:13px;

    word-break:break-word;
}

.wallet-number{

    font-size:18px;

    opacity:.95;

    word-break:break-word;
}


/* =========================
   BALANCE
========================= */

.balance-card{

    background:white;

    border-radius:27px;

    padding:30px 20px;

    text-align:center;

    margin-bottom:20px;

    box-shadow:
        0 5px 25px
        rgba(0,0,0,.06);
}

.balance-title{

    color:#777;

    font-size:18px;

    margin-bottom:12px;
}

.balance{

    color:#00a86b;

    font-size:32px;

    font-weight:bold;

    direction:rtl;
}


/* =========================
   ACTIONS
========================= */

.actions{

    background:white;

    border-radius:28px;

    padding:10px;

    box-shadow:
        0 5px 25px
        rgba(0,0,0,.06);
}

.wallet-action{

    width:100%;

    display:flex;

    align-items:center;

    justify-content:space-between;

    background:white;

    border:1px solid #eeeeee;

    border-radius:20px;

    padding:17px;

    margin:9px 0;

    text-decoration:none;

    color:#222;

    font-size:20px;

    font-weight:bold;

    transition:.2s;
}

.wallet-action:hover{

    background:#fafafa;
}

.wallet-action:active{

    transform:scale(.98);
}

.wallet-action-right{

    display:flex;

    align-items:center;

    gap:15px;
}

.wallet-action-icon{

    width:56px;

    height:56px;

    border-radius:17px;

    background:#e7f9ef;

    color:#00a86b;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:30px;

    font-weight:bold;

    flex-shrink:0;
}

.arrow{

    color:#999;

    font-size:30px;

    line-height:1;
}


/* =========================
   TRANSACTIONS
========================= */

.section{

    background:white;

    border-radius:25px;

    margin-top:22px;

    overflow:hidden;

    box-shadow:
        0 5px 25px
        rgba(0,0,0,.06);
}

.section-title{

    padding:20px;

    font-size:23px;

    font-weight:bold;

    border-bottom:1px solid #eee;
}

.transaction{

    padding:17px 20px;

    border-bottom:1px solid #eee;
}

.transaction:last-child{

    border-bottom:0;
}

.transaction-top{

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:10px;
}

.transaction-description{

    font-size:16px;

    font-weight:bold;

    line-height:1.6;
}

.transaction-amount{

    white-space:nowrap;

    font-size:17px;

    font-weight:bold;
}

.transaction-in{

    color:#00a86b;
}

.transaction-out{

    color:#d62828;
}

.transaction-date{

    color:#999;

    font-size:13px;

    margin-top:7px;
}

.empty{

    padding:30px;

    text-align:center;

    color:#888;

    line-height:1.8;
}

.loading{

    padding:25px;

    text-align:center;

    color:#888;
}


/* =========================
   ERROR
========================= */

.error-box{

    background:#fff1f2;

    color:#be123c;

    padding:18px;

    border-radius:15px;

    text-align:center;

    margin-top:15px;

    line-height:1.8;
}


/* =========================
   WHATSAPP
========================= */

.whatsapp-float{

    position:fixed;

    left:20px;

    bottom:92px;

    width:62px;

    height:62px;

    border-radius:50%;

    background:#25D366;

    display:flex;

    align-items:center;

    justify-content:center;

    text-decoration:none;

    box-shadow:
        0 5px 20px
        rgba(0,0,0,.25);

    z-index:9999;

    transition:.2s;
}

.whatsapp-float:active{

    transform:scale(.92);
}

.whatsapp-float svg{

    width:39px;

    height:39px;

    fill:white;
}


/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{

    position:fixed;

    left:14px;

    right:14px;

    bottom:10px;

    height:74px;

    background:#0b081b;

    border-radius:30px;

    display:flex;

    justify-content:space-around;

    align-items:center;

    z-index:9998;

    box-shadow:
        0 8px 30px
        rgba(0,0,0,.3);
}

.nav-item{

    width:25%;

    color:#999;

    text-decoration:none;

    text-align:center;

    font-size:12px;

    font-weight:bold;

    padding:5px 0;
}

.nav-icon{

    display:block;

    font-size:25px;

    margin-bottom:4px;

    line-height:1;
}

.nav-item.active{

    color:#a855f7;
}


/* =========================
   MOBILE
========================= */

@media(max-width:500px){

    .header{

    }

    }

    .container{

    .balance{

    }

    .wallet-action{

    }

    .wallet-action-icon{

        font-size:27px;
    }

    .whatsapp-float{

        left:18px;

        bottom:92px;

        width:60px;

        height:60px;
    }

}

</style>

<script>

/* =========================
   SUPABASE CONFIG
========================= */

const SUPABASE_URL =
    "https://uwmrzvsygeoequscpinx.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_26b3KZpWkLqltiLTyTSpIg_gTgexDts";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================
   CURRENT USER
========================= */

let currentUser = null;


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value){

    return String(value ?? "")

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================
   INIT
========================= */

async function initWallet(){

    try{

        const {
            data,
            error
        } =
        await supabaseClient
            .auth
            .getUser();


        if(error){

            console.error(
                "Auth Error:",
                error
            );

            window.location.href =
                "login.html";

            return;
        }


        const user =
            data?.user;


        if(!user){

            window.location.href =
                "login.html";

            return;
        }


        currentUser =
            user;


        await loadProfile();

        await loadBalance();

        await loadTransactions();

    }

    catch(error){

        console.error(
            "Wallet Init Error:",
            error
        );

    }

}


/* =========================
   LOAD PROFILE
========================= */

async function loadProfile(){

    const userName =
        document.getElementById(
            "userName"
        );


    const walletNumber =
        document.getElementById(
            "walletNumber"
        );


    /*
       مهم:
       هنا نستخدم id وليس uses_id
       ولا user_id.
    */

    const {
        data: profile,
        error
    } =
    await supabaseClient
        .from("profiles")
        .select(
            "id,full_name,phone,wallet_number"
        )
        .eq(
            "id",
            currentUser.id
        )
        .maybeSingle();


    if(error){

        console.error(
            "Profile Error:",
            error
        );


        userName.textContent =
            currentUser
                .user_metadata
                ?.full_name
            ||
            "مرحباً بك";


        walletNumber.textContent =
            "رقم المحفظة غير متوفر";


        return;
    }


    /*
       لا يوجد ملف profile
    */

    if(!profile){

        userName.textContent =
            currentUser
                .user_metadata
                ?.full_name
            ||
            "مرحباً بك";


        walletNumber.textContent =
            "رقم المحفظة غير متوفر";


        return;
    }


    /*
       الاسم
    */

    userName.textContent =
        profile.full_name
        ||
        currentUser
            .user_metadata
            ?.full_name
        ||
        "مرحباً بك";


    /*
       رقم المحفظة
    */

    if(

        profile.wallet_number !== null

        &&

        profile.wallet_number !== undefined

        &&

        String(
            profile.wallet_number
        ).trim() !== ""

    ){

        walletNumber.textContent =

            "رقم المحفظة: "

            +

            String(
                profile.wallet_number
            );

    }

    else{

        walletNumber.textContent =
            "رقم المحفظة غير متوفر";

    }

}


/* =========================
   LOAD BALANCE
========================= */

async function loadBalance(){

    const balanceElement =
        document.getElementById(
            "balance"
        );


    const {
        data,
        error
    } =
    await supabaseClient
        .from("wallets")
        .select(
            "balance"
        )
        .eq(
            "user_id",
            currentUser.id
        )
        .limit(1);


    if(error){

        console.error(
            "Wallet Error:",
            error
        );


        balanceElement.textContent =
            "تعذر تحميل الرصيد";


        return;
    }


    if(
        !data ||
        data.length === 0
    ){

        balanceElement.textContent =
            "0 ج.س";


        return;
    }


    const amount =
        Number(
            data[0].balance || 0
        );


    balanceElement.textContent =

        amount.toLocaleString(
            "ar-EG"
        )

        +

        " ج.س";

}


/* =========================
   LOAD TRANSACTIONS
========================= */

async function loadTransactions(){

    const box =
        document.getElementById(
            "transactionsList"
        );


    const {
        data,
        error
    } =
    await supabaseClient
        .from("wallet_transactions")
        .select(
            "id,type,amount,balance_before,balance_after,description,created_at"
        )
        .eq(
            "user_id",
            currentUser.id
        )
        .order(
            "created_at",
            {
                ascending:false
            }
        )
        .limit(50);


    if(error){

        console.error(
            "Transactions Error:",
            error
        );


        box.innerHTML = `

            <div class="empty">

                تعذر تحميل سجل المعاملات

            </div>

        `;


        return;
    }


    if(
        !data ||
        data.length === 0
    ){

        box.innerHTML = `

            <div class="empty">

                لا توجد معاملات حتى الآن

            </div>

        `;


        return;
    }


    box.innerHTML = "";


    data.forEach(
        transaction => {


            const amount =
                Number(
                    transaction.amount || 0
                );


            /*
               التحويل الوارد موجب
               والتحويل الصادر سالب.

               topup موجب.
            */

            const isIncoming =

                transaction.type ===
                "transfer_in"

                ||

                transaction.type ===
                "topup"

                ||

                amount > 0;


            const description =

                transaction.description

                ||

                getTransactionName(
                    transaction.type
                );


            const date =

                transaction.created_at

                ?

                new Date(
                    transaction.created_at
                ).toLocaleString(
                    "ar-EG"
                )

                :

                "";


            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "transaction";


            item.innerHTML = `

                <div class="transaction-top">

                    <div class="transaction-description">

                        ${escapeHtml(
                            description
                        )}

                    </div>


                    <div class="transaction-amount ${
                        isIncoming
                        ? "transaction-in"
                        : "transaction-out"
                    }">

                        ${
                            isIncoming
                            ? "+"
                            : "-"
                        }

                        ${Math.abs(amount)
                            .toLocaleString(
                                "ar-EG"
                            )}

                        ج.س

                    </div>

                </div>


                <div class="transaction-date">

                    ${escapeHtml(date)}

                </div>

            `;


            box.appendChild(
                item
            );

        }
    );

}


/* =========================
   TRANSACTION NAMES
========================= */

function getTransactionName(
    type
){

    if(
        type ===
        "transfer_in"
    ){

        return "تحويل وارد";

    }


    if(
        type ===
        "transfer_out"
    ){

        return "تحويل صادر";

    }


    if(
        type ===
        "topup"
    ){

        return "شحن المحفظة";

    }


    if(
        type ===
        "purchase"
    ){

        return "شراء";

    }


    if(
        type ===
        "refund"
    ){

        return "استرجاع مبلغ";

    }


    return "معاملة مالية";

}


/* =========================
   START
========================= */

initWallet();

</script>
