<!DOCTYPE html><html dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>كاترو شوب - محفظتي</title>
<style>body{background:#0f0f0f;color:#fff;font-family:sans-serif;padding:15px}.box{background:#1c1c1c;padding:15px;border-radius:12px;margin-bottom:15px}input{width:100%;padding:10px;margin:5px 0;border-radius:8px}button{background:#ffcc00;padding:10px;width:100%;border:none;border-radius:8px;font-weight:bold}</style></head><body>
<a href="index.html" style="color:#ffcc00">رجوع لكاترو شوب</a>
<div class="box"><h3>💰 محفظة كاترو شوب</h3><h1 id="bal">0 جنيه</h1>
<p>حول في بنكك: <b>2673843</b> باسم خالد حسين محمد حامد</p>
<input type="number" id="amount" placeholder="المبلغ الحولتو">
<input type="file" id="receipt"><button onclick="upload()">رفع الاشعار</button>
<p id="msg"></p></div>
<div class="box"><h3>طلباتي في كاترو شوب</h3><div id="orders"></div></div>
<script>
let w=localStorage.getItem('wallet')||0; document.getElementById('bal').innerText=w+' جنيه';
function upload(){let amt=document.getElementById('amount').value; if(!amt){alert('اكتب المبلغ');return}
let pend=JSON.parse(localStorage.getItem('pending')||'[]'); pend.push({amount:amt,date:new Date().toLocaleString(),status:'بانتظار'}); localStorage.setItem('pending',JSON.stringify(pend)); document.getElementById('msg').innerText='تم الرفع لكاترو شوب';}
let orders=JSON.parse(localStorage.getItem('orders')||'[]'); let html=''; orders.reverse().forEach(o=>{html+=`<div style="border-bottom:1px solid #333;padding:8px 0">${o.pack} - ${o.price}ج - ID:${o.id}<br>الحالة: <b>${o.status}</b></div>`}); document.getElementById('orders').innerHTML=html||'لا يوجد';
</script></body></html>
