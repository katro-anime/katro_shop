<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KATRO SHOP</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Tahoma,sans-serif;
}

body{
    background:#080b12;
    color:#fff;
    min-height:100vh;
}

header{
    background:#0d111c;
    border-bottom:1px solid #1c2435;
    padding:15px;
    position:sticky;
    top:0;
    z-index:10;
}

.header-inner{
    max-width:900px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.logo{
    color:#00b7ff;
    font-size:24px;
    font-weight:bold;
}

.back{
    color:#fff;
    text-decoration:none;
    background:#151c2b;
    padding:9px 14px;
    border-radius:10px;
}

.container{
    max-width:900px;
    margin:auto;
    padding:20px 15px 100px;
}

.game-title{
    text-align:center;
    margin:10px 0 20px;
}

.game-title h1{
    font-size:25px;
    color:#00b7ff;
}

.game-title p{
    color:#9ca8ba;
    margin-top:7px;
}

.balance{
    background:#0d111c;
    border:1px solid #1c2435;
    border-radius:15px;
    padding:15px;
    margin-bottom:20px;
    text-align:center;
}

.balance span{
    color:#00b7ff;
    font-size:22px;
    font-weight:bold;
}

.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
    gap:14px;
}

.product{
    background:#0d111c;
    border:1px solid #1c2435;
    border-radius:15px;
    padding:15px;
    text-align:center;
    transition:.2s;
}

.product:hover{
    transform:translateY(-3px);
    border-color:#00b7ff;
}

.product img{
    width:80px;
    height:80px;
    object-fit:cover;
    border-radius:14px;
    margin-bottom:10px;
}

.product h3{
    font-size:16px;
    margin-bottom:8px;
}

.description{
    color:#8f9bad;
    font-size:13px;
    min-height:32px;
    margin-bottom:10px;
}

.price{
    color:#00e1ff;
    font-weight:bold;
    font-size:18px;
    margin-bottom:12px;
}

.buy-btn{
    width:100%;
    border:none;
    background:#00b7ff;
    color:#001018;
    font-weight:bold;
    padding:11px;
    border-radius:10px;
    cursor:pointer;
}

.buy-btn:hover{
    opacity:.9;
}

.loading,
.empty,
.error{
    text-align:center;
    padding:30px;
    color:#9ca8ba;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.75);
    z-index:100;
    align-items:center;
    justify-content:center;
    padding:15px;
}

.modal-box{
    width:100%;
    max-width:450px;
    background:#0d111c;
    border:1px solid #263149;
    border-radius:18px;
    padding:20px;
}

.modal-box h2{
    color:#00b7ff;
    margin-bottom:15px;
}

.selected-product{
    background:#151c2b;
    padding:12px;
    border-radius:12px;
    margin-bottom:15px;
}

.selected-product strong{
    display:block;
    margin-bottom:5px;
}

.selected-product span{
    color:#00e1ff;
    font-weight:bold;
}

label{
    display:block;
    margin:10px 0 6px;
    color:#cbd3df;
}

input{
    width:100%;
    padding:12px;
    background:#080b12;
    color:#fff;
    border:1px solid #29344a;
    border-radius:10px;
    outline:none;
}

input:focus{
    border-color:#00b7ff;
}

.modal-buttons{
    display:flex;
    gap:10px;
    margin-top:18px;
}

.confirm{
    flex:1;
    border:none;
    background:#00b7ff;
    color:#001018;
    padding:12px;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
}

.cancel{
    flex:1;
    border:none;
    background:#252d3d;
    color:#fff;
    padding:12px;
    border-radius:10px;
    cursor:pointer;
}

.message{
    margin-top:12px;
    padding:10px;
    border-radius:10px;
    display:none;
    text-align:center;
}

.success{
    background:#103b2b;
    color:#65e6ae;
}

.fail{
    background:#421b22;
    color:#ff8995;
}

footer{
    text-align:center;
    color:#687386;
    padding:25px 15px;
    border-top:1px solid #1c2435;
}
</style>
</head>

<body>

<header>
    <div class="header-inner">
        <div class="logo">KATRO SHOP</div>
        <a href="index.html" class="back">الرئيسية</a>
    </div>
</header>

<div class="container">

    <div class="game-title">
        <h1 id="gameName">جاري التحميل...</h1>
        <p>اختر المنتج الذي تريد شراءه</p>
    </div>

    <div class="balance" id="balanceBox" style="display:none;">
        رصيد محفظتك:
        <span id="balance">0</span>
        ج.س
    </div>

    <div id="products" class="products">
        <div class="loading">جاري تحميل المنتجات...</div>
    </div>

</div>

<footer>
    © 2026 KATRO SHOP
</footer>


<!-- نافذة الشراء -->

<div class="modal" id="buyModal">

    <div class="modal-box">

        <h2>تأكيد الشراء</h2>

        <div class="selected-product">
            <strong id="selectedName"></strong>
            <span id="selectedPrice"></span> ج.س
        </div>

        <label>معرف اللاعب / ID</label>
        <input
            type="text"
            id="playerId"
            placeholder="أدخل ID اللاعب"
        >

        <label>معلومات الحساب</label>
        <input
            type="text"
            id="accountInfo"
            placeholder="اختياري"
        >

        <label>رقم الهاتف للتواصل</label>
        <input
            type="text"
            id="contactPhone"
            placeholder="أدخل رقم الهاتف"
        >

        <div
            id="modalMessage"
            class="message"
        ></div>

        <div class="modal-buttons">

            <button
                class="confirm"
                id="confirmBtn"
                onclick="confirmPurchase()"
            >
                تأكيد الشراء
            </button>

            <button
                class="cancel"
                onclick="closeModal()"
            >
                إلغاء
            </button>

        </div>

    </div>

</div>


<script>

const SUPABASE_URL =
    "https://uwmrzvsygeoequscpinx.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_26b3KZpWkLqltiLTyTSpIg_gTgexDts";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


const params =
    new URLSearchParams(window.location.search);

const gameKey =
    params.get("g");


let currentUser = null;
let selectedProduct = null;
let currentBalance = 0;


/* أسماء الألعاب */

const gameNames = {

    freefire: "Free Fire",

    pubg: "PUBG Mobile",

    codm: "Call of Duty Mobile",

    efootball: "eFootball",

    jawaker: "Jawaker",

    mobilelegends: "Mobile Legends",

    yallaludo: "Yalla Ludo",

    tiktok: "TikTok",

    googleplay: "Google Play",

    itunes: "iTunes",

    playstation: "PlayStation",

    xbox: "Xbox",

    razergold: "Razer Gold",

    netflix: "Netflix",

    visa: "Visa",

    mastercard: "Mastercard",

    zain: "Zain",

    mtn: "MTN",

    sudani: "Sudani",

    cashi: "Cashi",

    starlink: "Starlink",

    katrocard: "KATRO CARD",

    pyypl: "Pyypl"

};


document.getElementById("gameName").textContent =
    gameNames[gameKey] || "منتجات KATRO SHOP";


/* التحقق من تسجيل الدخول */

async function checkUser(){

    const {
        data,
        error
    } = await supabaseClient.auth.getSession();

    if(error){

        console.error(error);

        return;

    }

    if(!data.session){

        currentUser = null;

        document.getElementById("balanceBox").style.display =
            "none";

        return;

    }

    currentUser =
        data.session.user;

    document.getElementById("balanceBox").style.display =
        "block";

    await loadBalance();

}


/* تحميل الرصيد */

async function loadBalance(){

    if(!currentUser){

        return;

    }

    const {
        data,
        error
    } = await supabaseClient
        .from("wallets")
        .select("balance")
        .eq("user_id", currentUser.id)
        .single();


    if(error){

        console.error(error);

        return;

    }


    currentBalance =
        Number(data.balance || 0);


    document.getElementById("balance").textContent =
        currentBalance.toLocaleString("ar-EG");

}


/* تحميل المنتجات */

async function loadProducts(){

    const productsBox =
        document.getElementById("products");


    if(!gameKey){

        productsBox.innerHTML =
            '<div class="error">لم يتم تحديد المنتج</div>';

        return;

    }


    const {
        data,
        error
    } = await supabaseClient
        .from("products")
        .select("*")
        .eq("game_key", gameKey)
        .eq("active", true)
        .order("id");


    if(error){

        console.error(error);

        productsBox.innerHTML =
            '<div class="error">حدث خطأ أثناء تحميل المنتجات</div>';

        return;

    }


    if(!data || data.length === 0){

        productsBox.innerHTML =
            '<div class="empty">لا توجد منتجات متاحة حالياً</div>';

        return;

    }


    productsBox.innerHTML = "";


    data.forEach(product => {

        const card =
            document.createElement("div");

        card.className =
            "product";


        const image =
            product.image_url
            || "https://via.placeholder.com/100";


        card.innerHTML = `

            <img
                src="${escapeHtml(image)}"
                alt="${escapeHtml(product.name)}"
            >

            <h3>
                ${escapeHtml(product.name)}
            </h3>

            <div class="description">
                ${escapeHtml(product.description || "")}
            </div>

            <div class="price">
                ${Number(product.price).toLocaleString("ar-EG")}
                ج.س
            </div>

            <button
                class="buy-btn"
                onclick='openBuyModal(${JSON.stringify(product)})'
            >
                شراء
            </button>

        `;


        productsBox.appendChild(card);

    });

}


/* فتح نافذة الشراء */

function openBuyModal(product){

    if(!currentUser){

        alert("يجب تسجيل الدخول أولاً");

        window.location.href =
            "login.html";

        return;

    }


    selectedProduct =
        product;


    document.getElementById("selectedName")
        .textContent =
        product.name;


    document.getElementById("selectedPrice")
        .textContent =
        Number(product.price)
        .toLocaleString("ar-EG");


    document.getElementById("playerId").value =
        "";

    document.getElementById("accountInfo").value =
        "";

    document.getElementById("contactPhone").value =
        "";


    hideMessage();


    document.getElementById("buyModal").style.display =
        "flex";

}


/* إغلاق النافذة */

function closeModal(){

    document.getElementById("buyModal").style.display =
        "none";

}


/* تنفيذ الشراء */

async function confirmPurchase(){

    if(!currentUser){

        showMessage(
            "يجب تسجيل الدخول أولاً",
            false
        );

        return;

    }


    if(!selectedProduct){

        return;

    }


    const playerId =
        document.getElementById("playerId")
            .value
            .trim();


    const accountInfo =
        document.getElementById("accountInfo")
            .value
            .trim();


    const contactPhone =
        document.getElementById("contactPhone")
            .value
            .trim();


    if(!contactPhone){

        showMessage(
            "أدخل رقم الهاتف للتواصل",
            false
        );

        return;

    }


    const price =
        Number(selectedProduct.price);


    if(currentBalance < price){

        showMessage(
            "رصيدك غير كافٍ. يرجى شحن المحفظة أولاً.",
            false
        );

        return;

    }


    const button =
        document.getElementById("confirmBtn");


    button.disabled =
        true;

    button.textContent =
        "جاري تنفيذ الشراء...";


    hideMessage();


    try{

        const {
            data,
            error
        } = await supabaseClient.rpc(

            "create_order_and_charge",

            {
                p_product_id:
                    selectedProduct.id,

                p_player_id:
                    playerId || null,

                p_account_info:
                    accountInfo || null,

                p_contact_phone:
                    contactPhone || null,

                p_quantity:
                    1
            }

        );


        if(error){

            throw error;

        }


        if(!data || !data.success){

            throw new Error(
                "تعذر تنفيذ عملية الشراء"
            );

        }


        currentBalance =
            Number(data.new_balance);


        document.getElementById("balance").textContent =
            currentBalance.toLocaleString("ar-EG");


        showMessage(

            "تم الشراء بنجاح! رقم الطلب: #" +
            data.order_number,

            true

        );


        setTimeout(() => {

            closeModal();

        }, 2500);


    }catch(error){

        console.error(error);


        let message =
            error.message ||
            "حدث خطأ أثناء عملية الشراء";


        if(
            message.includes("رصيدك غير كافٍ")
        ){

            message =
                "رصيدك غير كافٍ";

        }


        if(
            message.includes("يجب تسجيل الدخول")
        ){

            message =
                "يجب تسجيل الدخول أولاً";

        }


        showMessage(
            message,
            false
        );


    }finally{

        button.disabled =
            false;

        button.textContent =
            "تأكيد الشراء";

    }

}


/* رسالة النافذة */

function showMessage(
    message,
    success
){

    const box =
        document.getElementById("modalMessage");


    box.textContent =
        message;


    box.className =
        "message " +
        (success ? "success" : "fail");


    box.style.display =
        "block";

}


function hideMessage(){

    const box =
        document.getElementById("modalMessage");

    box.style.display =
        "none";

}


/* حماية النصوص */

function escapeHtml(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* التشغيل */

async function init(){

    await checkUser();

    await loadProducts();

}


init();

</script>

</body>
</html>
