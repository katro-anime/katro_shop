<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>OMER SHOP</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Tahoma,sans-serif;
    background:#080b12;
    color:#fff;
}

header{
    background:linear-gradient(135deg,#0d111c,#111827);
    border-bottom:1px solid #1f2937;
    padding:15px;
    position:sticky;
    top:0;
    z-index:100;
}

.header-inner{
    max-width:1200px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.logo{
    font-size:24px;
    font-weight:bold;
    color:#00b7ff;
}

.header-buttons{
    display:flex;
    gap:8px;
}

.header-btn{
    border:none;
    background:#111827;
    color:#fff;
    border:1px solid #263244;
    padding:9px 13px;
    border-radius:10px;
    cursor:pointer;
    font-size:14px;
}

.header-btn:hover{
    background:#172235;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:20px 15px 90px;
}

.page-title{
    text-align:center;
    margin:10px 0 5px;
    font-size:28px;
    color:#00b7ff;
}

.page-subtitle{
    text-align:center;
    color:#9ca3af;
    margin-bottom:20px;
}

.balance-box{
    display:none;
    background:#0d1421;
    border:1px solid #1d3348;
    border-radius:15px;
    padding:15px;
    margin-bottom:20px;
    text-align:center;
}

.balance-label{
    color:#9ca3af;
    font-size:14px;
    margin-bottom:7px;
}

.balance{
    font-size:23px;
    font-weight:bold;
    color:#00d084;
}

.balance-error{
    color:#ff5c5c !important;
}

.products{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:15px;
}

.product{
    background:#0d111c;
    border:1px solid #1f2937;
    border-radius:16px;
    overflow:hidden;
    transition:.2s;
}

.product:hover{
    transform:translateY(-3px);
    border-color:#00b7ff;
}

.product-image{
    width:100%;
    height:180px;
    object-fit:cover;
    background:#111827;
    display:block;
}

.product-content{
    padding:15px;
}

.product-name{
    font-size:18px;
    font-weight:bold;
    margin-bottom:8px;
}

.product-description{
    color:#9ca3af;
    font-size:14px;
    min-height:38px;
    line-height:1.6;
    margin-bottom:12px;
}

.product-price{
    color:#00d084;
    font-size:18px;
    font-weight:bold;
    margin-bottom:12px;
}

.add-btn{
    width:100%;
    border:none;
    background:#00b7ff;
    color:#00131c;
    padding:11px;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
}

.add-btn:hover{
    background:#19c1ff;
}

.loading,
.empty,
.error{
    grid-column:1/-1;
    text-align:center;
    background:#0d111c;
    border:1px solid #1f2937;
    border-radius:15px;
    padding:25px;
    color:#9ca3af;
}

.error{
    color:#ff6868;
}

.debug-info{
    margin-top:12px;
    padding:10px;
    background:#111827;
    border-radius:8px;
    color:#fca5a5;
    direction:ltr;
    text-align:left;
    word-break:break-word;
    font-size:12px;
}

/* CART */

.cart-button{
    position:fixed;
    bottom:20px;
    left:20px;
    z-index:200;
    background:#00b7ff;
    color:#00131c;
    border:none;
    border-radius:50px;
    padding:13px 18px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 5px 20px rgba(0,0,0,.4);
}

.cart-count{
    background:#ff3b3b;
    color:#fff;
    border-radius:50%;
    padding:3px 7px;
    margin-right:5px;
}

/* MODAL */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.75);
    z-index:500;
    padding:15px;
    overflow:auto;
}

.modal-box{
    max-width:650px;
    margin:40px auto;
    background:#0d111c;
    border:1px solid #263244;
    border-radius:18px;
    padding:20px;
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.modal-header h2{
    margin:0;
    color:#00b7ff;
}

.close-btn{
    border:none;
    background:#1f2937;
    color:#fff;
    width:35px;
    height:35px;
    border-radius:50%;
    cursor:pointer;
    font-size:18px;
}

.cart-item{
    background:#111827;
    border:1px solid #1f2937;
    border-radius:12px;
    padding:12px;
    margin-bottom:10px;
}

.cart-item-top{
    display:flex;
    justify-content:space-between;
    gap:10px;
}

.cart-item-name{
    font-weight:bold;
}

.cart-item-price{
    color:#00d084;
}

.cart-controls{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:10px;
}

.qty-btn{
    border:none;
    background:#1f2937;
    color:#fff;
    width:32px;
    height:32px;
    border-radius:8px;
    cursor:pointer;
}

.remove-btn{
    border:none;
    background:#7f1d1d;
    color:#fff;
    padding:7px 10px;
    border-radius:8px;
    cursor:pointer;
    margin-right:auto;
}

.total-box{
    border-top:1px solid #263244;
    margin-top:15px;
    padding-top:15px;
    display:flex;
    justify-content:space-between;
    font-size:19px;
    font-weight:bold;
}

.total-price{
    color:#00d084;
}

.checkout-btn{
    width:100%;
    margin-top:15px;
    border:none;
    background:#00b7ff;
    color:#00131c;
    padding:13px;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
}

/* CHECKOUT */

.form-group{
    margin-bottom:13px;
}

.form-group label{
    display:block;
    margin-bottom:6px;
    color:#d1d5db;
    font-size:14px;
}

.form-group input,
.form-group select,
.form-group textarea{
    width:100%;
    background:#080b12;
    color:#fff;
    border:1px solid #263244;
    border-radius:9px;
    padding:11px;
    outline:none;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus{
    border-color:#00b7ff;
}

.form-group textarea{
    min-height:80px;
    resize:vertical;
}

.field{
    display:none;
}

.note{
    background:#111827;
    border:1px solid #263244;
    color:#9ca3af;
    padding:10px;
    border-radius:10px;
    font-size:13px;
    line-height:1.6;
    margin-bottom:15px;
}

footer{
    text-align:center;
    color:#6b7280;
    padding:25px 10px;
    border-top:1px solid #1f2937;
    margin-top:30px;
}

@media(max-width:600px){

    .products{
        grid-template-columns:repeat(2,1fr);
        gap:10px;
    }

    .product-image{
        height:140px;
    }

    .product-content{
        padding:10px;
    }

    .product-name{
        font-size:15px;
    }

    .product-description{
        font-size:12px;
    }

    .product-price{
        font-size:15px;
    }

    .add-btn{
        font-size:12px;
        padding:9px;
    }

}

</style>

</head>

id="products">

<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://uwmrzvsygeoequscpinx.supabase.co";

const SUPABASE_KEY =
"sb_publishable_26b3KZpWkLqltiLTyTSpIg_gTgexDts";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================
   VARIABLES
========================= */

const params =
new URLSearchParams(
    window.location.search
);

let gameKey =
(params.get("g") || "")
.trim()
.toLowerCase();

let currentUser = null;

let currentBalance = 0;

let cart = [];


/* =========================
   GAME NAMES
========================= */

const gameNames = {

    freefire:"Free Fire",
    pubg:"PUBG Mobile",
    codm:"Call of Duty Mobile",
    efootball:"eFootball",
    jawaker:"Jawaker",
    mobilelegends:"Mobile Legends",
    yallaludo:"Yalla Ludo",
    tiktok:"TikTok",
    googleplay:"Google Play",
    itunes:"iTunes",
    playstation:"PlayStation",
    xbox:"Xbox",
    razergold:"Razer Gold",
    netflix:"Netflix",
    visa:"Visa",
    mastercard:"Mastercard",
    zain:"Zain",
    mtn:"MTN",
    sudani:"Sudani",
    cashi:"Cashi",
    starlink:"Starlink",
    katro:"KATRO",
    katrocard:"KATRO Card",
    pyypl:"Pyypl"

};


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value){

    if(value === null ||
       value === undefined){

        return "";

    }

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================
   PAGE TITLE
========================= */

function setGameTitle(){

    const title =
        gameNames[gameKey] ||
        gameKey ||
        "الخدمات";

    document.title =
        title + " | KATRO SHOP";

    document.getElementById(
        "gameTitle"
    ).textContent =
        title;

}


/* =========================
   HOME
========================= */

function goHome(){

    window.location.href =
        "index.html";

}


/* =========================
   WALLET
========================= */

function goWallet(){

    window.location.href =
        "wallet.html";

}


/* =========================
   CHECK USER
========================= */

async function checkUser(){

    const {
        data,
        error
    } =
    await supabaseClient.auth.getSession();


    if(error){

        console.error(
            "Session Error:",
            error
        );

        currentUser = null;

        document.getElementById(
            "balanceBox"
        ).style.display = "none";

        return;

    }


    if(!data ||
       !data.session){

        currentUser = null;

        document.getElementById(
            "balanceBox"
        ).style.display = "none";

        return;

    }


    currentUser =
        data.session.user;


    document.getElementById(
        "balanceBox"
    ).style.display =
        "block";


    document.getElementById(
        "balance"
    ).textContent =
        "جاري تحميل الرصيد...";


    await loadBalance();

}


/* =========================
   LOAD BALANCE
========================= */

async function loadBalance(){

    const balanceElement =
        document.getElementById(
            "balance"
        );


    if(!currentUser){

        balanceElement.textContent =
            "سجل الدخول لرؤية الرصيد";

        return;

    }


    balanceElement.classList.remove(
        "balance-error"
    );


    const {
        data,
        error
    } =
    await supabaseClient
        .from("wallets")
        .select("balance")
        .eq(
            "user_id",
            currentUser.id
        )
        .limit(1);


    if(error){

        console.error(
            "Wallet Error:",
            error
        );


        balanceElement.textContent =
            "تعذر تحميل الرصيد";

        balanceElement.classList.add(
            "balance-error"
        );

        return;

    }


    if(!data ||
       data.length === 0){

        currentBalance = 0;

        balanceElement.textContent =
            "0 ج.س";

        return;

    }


    currentBalance =
        Number(
            data[0].balance || 0
        );


    balanceElement.textContent =
        currentBalance.toLocaleString(
            "ar-EG"
        )
        +
        " ج.س";

}


/* =========================
   LOAD PRODUCTS
========================= */

async function loadProducts(){

    const productsBox =
        document.getElementById(
            "products"
        );


    if(!gameKey){

        productsBox.innerHTML = `
            <div class="error">
                لم يتم تحديد القسم.
            </div>
        `;

        return;

    }


    productsBox.innerHTML = `
        <div class="loading">
            جاري تحميل الخدمات...
        </div>
    `;


    /*
       نستخدم ilike حتى يعمل القسم
       سواء كان game_key مكتوباً
       بحروف كبيرة أو صغيرة.
    */

    const {
        data,
        error
    } =
    await supabaseClient
        .from("products")
        .select(
            "id,game_key,name,description,price,image_url,active"
        )
        .eq(
            "active",
            true
        )
        .ilike(
            "game_key",
            gameKey
        )
        .order(
            "id",
            {
                ascending:true
            }
        );


    if(error){

        console.error(
            "Products Error:",
            error
        );


        productsBox.innerHTML = `
            <div class="error">

                حدث خطأ أثناء تحميل الخدمات.

                <div class="debug-info">

                    ${escapeHtml(
                        error.message ||
                        error.details ||
                        "خطأ غير معروف"
                    )}

                </div>

            </div>
        `;

        return;

    }


    if(!data ||
       data.length === 0){

        productsBox.innerHTML = `
            <div class="empty">

                لا توجد خدمات متاحة لهذا القسم حالياً.

                <div class="debug-info">

                    game_key:
                    ${escapeHtml(gameKey)}

                </div>

            </div>
        `;

        return;

    }


    renderProducts(data);

}


/* =========================
   RENDER PRODUCTS
========================= */

function renderProducts(products){

    const productsBox =
        document.getElementById(
            "products"
        );


    productsBox.innerHTML = "";


    products.forEach(product => {

        const card =
            document.createElement(
                "div"
            );

        card.className =
            "product";


        const image =
            product.image_url ||
            "https://via.placeholder.com/500x300?text=KATRO+SHOP";


        const price =
            Number(
                product.price || 0
            );


        card.innerHTML = `

            <img
                class="product-image"
                src="${escapeHtml(image)}"
                alt="${escapeHtml(product.name)}"
                onerror="this.src='https://via.placeholder.com/500x300?text=KATRO+SHOP'"
            >

            <div class="product-content">

                <div class="product-name">

                    ${escapeHtml(
                        product.name
                    )}

                </div>

                <div class="product-description">

                    ${escapeHtml(
                        product.description ||
                        "باقة متاحة للشراء"
                    )}

                </div>

                <div class="product-price">

                    ${price.toLocaleString("ar-EG")}
                    ج.س

                </div>

                <button
                    class="add-btn"
                    onclick='addToCart(${JSON.stringify(product)})'
                >

                    🛒 إضافة إلى السلة

                </button>

            </div>

        `;


        productsBox.appendChild(card);

    });

}


/* =========================
   LOGIN CHECK
========================= */

async function requireLogin(){

    const {
        data
    } =
    await supabaseClient.auth.getSession();


    if(!data ||
       !data.session){

        alert(
            "يجب تسجيل الدخول أولاً."
        );

        window.location.href =
            "login.html";

        return false;

    }


    currentUser =
        data.session.user;

    return true;

}


/* =========================
   ADD TO CART
========================= */

async function addToCart(product){

    const loggedIn =
        await requireLogin();


    if(!loggedIn){
        return;
    }


    const existing =
        cart.find(
            item =>
            item.id === product.id
        );


    if(existing){

        existing.quantity += 1;

    }else{

        cart.push({

            id:product.id,
            game_key:product.game_key,
            name:product.name,
            description:product.description,
            price:Number(product.price || 0),
            image_url:product.image_url,
            quantity:1

        });

    }


    saveCart();

    updateCartUI();


    alert(
        "تمت إضافة المنتج إلى السلة."
    );

}


/* =========================
   SAVE CART
========================= */

function saveCart(){

    localStorage.setItem(
        "katro_cart",
        JSON.stringify(cart)
    );

}


/* =========================
   LOAD CART
========================= */

function loadCart(){

    try{

        const saved =
            localStorage.getItem(
                "katro_cart"
            );


        if(saved){

            const parsed =
                JSON.parse(saved);


            if(Array.isArray(parsed)){

                cart = parsed;

            }

        }

    }catch(error){

        console.error(
            "Cart Error:",
            error
        );

        cart = [];

    }


    updateCartUI();

}


/* =========================
   UPDATE CART
========================= */

function updateCartUI(){

    const countElement =
        document.getElementById(
            "cartCount"
        );


    const totalQuantity =
        cart.reduce(
            (sum,item) =>
                sum +
                Number(item.quantity || 0),
            0
        );


    countElement.textContent =
        totalQuantity;


    const cartItems =
        document.getElementById(
            "cartItems"
        );


    if(!cartItems){
        return;
    }


    if(cart.length === 0){

        cartItems.innerHTML = `
            <div class="empty">
                السلة فارغة.
            </div>
        `;

        document.getElementById(
            "cartTotal"
        ).textContent =
            "0 ج.س";

        return;

    }


    cartItems.innerHTML = "";


    let total = 0;


    cart.forEach(
        (item,index) => {

            const price =
                Number(
                    item.price || 0
                );

            const quantity =
                Number(
                    item.quantity || 1
                );

            const itemTotal =
                price * quantity;


            total += itemTotal;


            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "cart-item";


            div.innerHTML = `

                <div class="cart-item-top">

                    <div class="cart-item-name">

                        ${escapeHtml(item.name)}

                    </div>

                    <div class="cart-item-price">

                        ${itemTotal.toLocaleString("ar-EG")}
                        ج.س

                    </div>

                </div>


                <div class="cart-controls">

                    <button
                        class="qty-btn"
                        onclick="changeQuantity(${index},-1)"
                    >
                        -
                    </button>


                    <span>
                        ${quantity}
                    </span>


                    <button
                        class="qty-btn"
                        onclick="changeQuantity(${index},1)"
                    >
                        +
                    </button>


                    <button
                        class="remove-btn"
                        onclick="removeFromCart(${index})"
                    >
                        حذف
                    </button>

                </div>

            `;


            cartItems.appendChild(div);

        }
    );


    document.getElementById(
        "cartTotal"
    ).textContent =
        total.toLocaleString("ar-EG")
        +
        " ج.س";

}


/* =========================
   CHANGE QUANTITY
========================= */

function changeQuantity(index,change){

    if(!cart[index]){
        return;
    }


    cart[index].quantity =
        Number(
            cart[index].quantity || 1
        )
        +
        change;


    if(cart[index].quantity <= 0){

        cart.splice(
            index,
            1
        );

    }


    saveCart();

    updateCartUI();

}


/* =========================
   REMOVE
========================= */

function removeFromCart(index){

    if(!cart[index]){
        return;
    }


    cart.splice(
        index,
        1
    );


    saveCart();

    updateCartUI();

}


/* =========================
   OPEN CART
========================= */

function openCart(){

    updateCartUI();


    document.getElementById(
        "cartModal"
    ).style.display =
        "block";

}


/* =========================
   CLOSE CART
========================= */

function closeCart(){

    document.getElementById(
        "cartModal"
    ).style.display =
        "none";

}


/* =========================
   OPEN CHECKOUT
========================= */

async function openCheckout(){

    if(cart.length === 0){

        alert(
            "السلة فارغة."
        );

        return;

    }


    const loggedIn =
        await requireLogin();


    if(!loggedIn){
        return;
    }


    closeCart();


    document.getElementById(
        "checkoutModal"
    ).style.display =
        "block";

}


/* =========================
   CLOSE CHECKOUT
========================= */

function closeCheckout(){

    document.getElementById(
        "checkoutModal"
    ).style.display =
        "none";

}


/* =========================
   ACCOUNT TYPE
========================= */

function changeAccountType(){

    const type =
        document.getElementById(
            "accountType"
        ).value;


    document.querySelectorAll(
        ".field"
    ).forEach(
        field => {
            field.style.display =
                "none";
        }
    );


    /*
       Player ID / UID
    */

    if(
        type === "player_id" ||
        type === "uid" ||
        type === "user_id"
    ){

        document.getElementById(
            "playerIdField"
        ).style.display =
            "block";

    }


    /*
       Phone
    */

    if(type === "phone"){

        document.getElementById(
            "phoneField"
        ).style.display =
            "block";

    }


    /*
       Email
       يظهر البريد وكلمة المرور
    */

    if(type === "email"){

        document.getElementById(
            "emailField"
        ).style.display =
            "block";


        document.getElementById(
            "passwordField"
        ).style.display =
            "block";

    }


    /*
       Account
    */

    if(type === "account"){

        document.getElementById(
            "usernameField"
        ).style.display =
            "block";


        document.getElementById(
            "passwordField"
        ).style.display =
            "block";

    }


    /*
       Other
    */

    if(type === "other"){

        document.getElementById(
            "otherField"
        ).style.display =
            "block";

    }

}


/* =========================
   GET TOTAL
========================= */

function getCartTotal(){

    return cart.reduce(
        (total,item) => {

            return total +
                (
                    Number(item.price || 0) *
                    Number(item.quantity || 1)
                );

        },
        0
    );

}


/* =========================
   COMPLETE PURCHASE
========================= */

async function completePurchase(){

    if(cart.length === 0){

        alert(
            "السلة فارغة."
        );

        return;

    }


    const loggedIn =
        await requireLogin();


    if(!loggedIn){
        return;
    }


    const accountType =
        document.getElementById(
            "accountType"
        ).value;


    if(!accountType){

        alert(
            "اختر نوع الحساب."
        );

        return;

    }


    const playerId =
        document.getElementById(
            "playerId"
        ).value.trim();


    const accountPhone =
        document.getElementById(
            "accountPhone"
        ).value.trim();


    const accountEmail =
        document.getElementById(
            "accountEmail"
        ).value.trim();


    const accountPassword =
        document.getElementById(
            "accountPassword"
        ).value;


    const accountUsername =
        document.getElementById(
            "accountUsername"
        ).value.trim();


    const otherInfo =
        document.getElementById(
            "otherInfo"
        ).value.trim();


    const contactPhone =
        document.getElementById(
            "contactPhone"
        ).value.trim();


    /*
       التحقق
    */

    if(
        (
            accountType === "player_id" ||
            accountType === "uid" ||
            accountType === "user_id"
        )
        &&
        !playerId
    ){

        alert(
            "أدخل Player ID / UID."
        );

        return;

    }


    if(
        accountType === "phone" &&
        !accountPhone
    ){

        alert(
            "أدخل رقم الهاتف."
        );

        return;

    }


    if(
        accountType === "email" &&
        (
            !accountEmail ||
            !accountPassword
        )
    ){

        alert(
            "أدخل البريد الإلكتروني وكلمة المرور."
        );

        return;

    }


    if(
        accountType === "account" &&
        (
            !accountUsername ||
            !accountPassword
        )
    ){

        alert(
            "أدخل اسم المستخدم وكلمة المرور."
        );

        return;

    }


    if(
        accountType === "other" &&
        !otherInfo
    ){

        alert(
            "أدخل معلومات الحساب."
        );

        return;

    }


    if(!contactPhone){

        alert(
            "أدخل رقم التواصل."
        );

        return;

    }


    const total =
        getCartTotal();


    /*
       التأكد من الرصيد
    */

    await loadBalance();


    if(
        currentBalance <
        total
    ){

        alert(
            "رصيد المحفظة غير كافٍ."
        );

        return;

    }


    const button =
        document.getElementById(
            "purchaseButton"
        );


    button.disabled =
        true;

    button.textContent =
        "جاري تنفيذ الطلب...";


    try{

        let successfulOrders = 0;


        for(
            const item of cart
        ){

            /*
               الخدمات الخاصة بالشحن
               عبر صفحة الهاتف لا تستخدم
               RPC الشراء العادي.
            */

            if(
                item.mobile_topup === true
            ){

                continue;

            }


            const finalAccountInfo = {

                account_type:
                    accountType,

                player_id:
                    playerId,

                phone:
                    accountPhone,

                email:
                    accountEmail,

                password:
                    accountPassword,

                username:
                    accountUsername,

                other:
                    otherInfo

            };


            const {
                data,
                error
            } =
            await supabaseClient.rpc(
                "create_order_and_charge",
                {
                    p_product_id:
                        item.id,

                    p_player_id:
                        playerId || null,

                    p_account_info:
                        finalAccountInfo,

                    p_contact_phone:
                        contactPhone,

                    p_quantity:
                        Number(
                            item.quantity || 1
                        )
                }
            );


            if(error){

                console.error(
                    "Purchase Error:",
                    error
                );

                throw error;

            }


            successfulOrders++;

        }


        if(successfulOrders === 0){

            alert(
                "لم يتم تنفيذ أي طلب."
            );

            return;

        }


        /*
           إفراغ السلة
        */

        cart = [];

        saveCart();

        updateCartUI();


        /*
           تحديث الرصيد
        */

        await loadBalance();


        closeCheckout();


        alert(
            "تم إنشاء الطلب بنجاح."
        );


    }catch(error){

        console.error(
            "Complete Purchase Error:",
            error
        );


        alert(
            "حدث خطأ أثناء تنفيذ الطلب:\n" +
            (
                error.message ||
                "خطأ غير معروف"
            )
        );


    }finally{

        button.disabled =
            false;

        button.textContent =
            "تأكيد الطلب";

    }

}


/* =========================
   MOBILE TOPUP REDIRECT
========================= */

function checkMobileTopup(){

    if(
        gameKey === "zain" ||
        gameKey === "mtn" ||
        gameKey === "sudani"
    ){

        window.location.href =
            "mobile-topup.html?network=" +
            encodeURIComponent(gameKey);

        return true;

    }

    return false;

}


/* =========================
   CLOSE MODAL WHEN CLICK
   OUTSIDE
========================= */

window.addEventListener(
    "click",
    function(event){

        const cartModal =
            document.getElementById(
                "cartModal"
            );

        const checkoutModal =
            document.getElementById(
                "checkoutModal"
            );


        if(event.target === cartModal){

            closeCart();

        }


        if(event.target === checkoutModal){

            closeCheckout();

        }

    }
);


/* =========================
   INIT
========================= */

async function init(){

    loadCart();

    setGameTitle();


    /*
       تحويل خدمات الاتصالات
    */

    if(checkMobileTopup()){

        return;

    }


    /*
       فحص تسجيل الدخول والرصيد
    */

    await checkUser();


    /*
       تحميل الخدمات
    */

    await loadProducts();

}


/* START */

init();

</script>
