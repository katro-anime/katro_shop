<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>KATRO SHOP</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Tahoma,sans-serif;
}

body{
    background:#080b12;
    color:#fff;
    min-height:100vh;
}

header{
    background:#0d111c;
    border-bottom:1px solid #1c2435;
    padding:15px;
    position:sticky;
    top:0;
    z-index:20;
}

.header-inner{
    max-width:900px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.logo{
    color:#00b7ff;
    font-size:24px;
    font-weight:bold;
}

.header-actions{
    display:flex;
    align-items:center;
    gap:8px;
}

.back,
.cart-button{
    color:#fff;
    text-decoration:none;
    background:#151c2b;
    padding:9px 14px;
    border-radius:10px;
    border:none;
    cursor:pointer;
    font-weight:bold;
}

.cart-button{
    position:relative;
}

.cart-count{
    position:absolute;
    top:-7px;
    left:-7px;
    min-width:20px;
    height:20px;
    border-radius:50%;
    background:#ff3b30;
    color:#fff;
    font-size:11px;
    display:none;
    align-items:center;
    justify-content:center;
    font-weight:bold;
}

.container{
    max-width:900px;
    margin:auto;
    padding:20px 15px 100px;
}

.game-title{
    text-align:center;
    margin:10px 0 20px;
}

.game-title h1{
    font-size:25px;
    color:#00b7ff;
}

.game-title p{
    color:#9ca8ba;
    margin-top:7px;
}

.balance{
    background:#0d111c;
    border:1px solid #1c2435;
    border-radius:15px;
    padding:15px;
    margin-bottom:20px;
    text-align:center;
}

.balance span{
    color:#00b7ff;
    font-size:22px;
    font-weight:bold;
}

.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
    gap:14px;
}

.product{
    background:#0d111c;
    border:1px solid #1c2435;
    border-radius:15px;
    padding:15px;
    text-align:center;
    transition:.2s;
}

.product:hover{
    transform:translateY(-3px);
    border-color:#00b7ff;
}

.product-image-box{
    width:100%;
    height:130px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:10px;
    background:#151c2b;
    border-radius:14px;
    overflow:hidden;
}

.product img{
    width:100%;
    height:100%;
    object-fit:contain;
    border-radius:14px;
}

.image-fallback{
    font-size:45px;
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
    height:100%;
}

.product h3{
    font-size:16px;
    margin-bottom:8px;
}

.description{
    color:#8f9bad;
    font-size:13px;
    min-height:32px;
    margin-bottom:10px;
}

.price{
    color:#00e1ff;
    font-weight:bold;
    font-size:18px;
    margin-bottom:12px;
}

.buy-btn{
    width:100%;
    border:none;
    background:#00b7ff;
    color:#001018;
    font-weight:bold;
    padding:11px;
    border-radius:10px;
    cursor:pointer;
}

.buy-btn:hover{
    opacity:.9;
}

.loading,
.empty,
.error{
    text-align:center;
    padding:30px;
    color:#9ca8ba;
}


/* =========================
   السلة
========================= */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.78);
    z-index:100;
    align-items:center;
    justify-content:center;
    padding:15px;
}

.modal-box{
    width:100%;
    max-width:500px;
    max-height:90vh;
    overflow-y:auto;
    background:#0d111c;
    border:1px solid #263149;
    border-radius:18px;
    padding:20px;
}

.modal-box h2{
    color:#00b7ff;
    margin-bottom:15px;
}

.close-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:15px;
}

.close-btn{
    background:#252d3d;
    border:none;
    color:#fff;
    width:35px;
    height:35px;
    border-radius:10px;
    cursor:pointer;
    font-size:18px;
}


/* =========================
   عناصر السلة
========================= */

.cart-item{
    background:#151c2b;
    border:1px solid #263149;
    border-radius:13px;
    padding:12px;
    margin-bottom:10px;
}

.cart-item-top{
    display:flex;
    justify-content:space-between;
    gap:10px;
}

.cart-item-name{
    font-weight:bold;
}

.cart-item-price{
    color:#00e1ff;
    font-weight:bold;
    white-space:nowrap;
}

.cart-controls{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:10px;
}

.quantity-controls{
    display:flex;
    align-items:center;
    gap:8px;
}

.quantity-btn{
    width:32px;
    height:32px;
    border:none;
    border-radius:8px;
    background:#252d3d;
    color:#fff;
    cursor:pointer;
    font-size:18px;
}

.quantity-number{
    min-width:25px;
    text-align:center;
    font-weight:bold;
}

.remove-btn{
    background:#421b22;
    color:#ff8995;
    border:none;
    padding:7px 10px;
    border-radius:8px;
    cursor:pointer;
    font-size:12px;
}

.cart-total{
    background:#151c2b;
    border:1px solid #263149;
    padding:14px;
    border-radius:12px;
    margin-top:15px;
    text-align:center;
}

.cart-total strong{
    color:#00b7ff;
    font-size:21px;
}

.cart-empty{
    text-align:center;
    padding:30px 10px;
    color:#9ca8ba;
}


/* =========================
   النموذج
========================= */

.selected-product{
    background:#151c2b;
    padding:12px;
    border-radius:12px;
    margin-bottom:15px;
}

.selected-product strong{
    display:block;
    margin-bottom:5px;
}

.selected-product span{
    color:#00e1ff;
    font-weight:bold;
}

label{
    display:block;
    margin:10px 0 6px;
    color:#cbd3df;
}

input,
select{
    width:100%;
    padding:12px;
    background:#080b12;
    color:#fff;
    border:1px solid #29344a;
    border-radius:10px;
    outline:none;
}

input:focus,
select:focus{
    border-color:#00b7ff;
}

.info-note{
    color:#8f9bad;
    font-size:12px;
    margin-top:6px;
    line-height:1.6;
}

.modal-buttons{
    display:flex;
    gap:10px;
    margin-top:18px;
}

.confirm{
    flex:1;
    border:none;
    background:#00b7ff;
    color:#001018;
    padding:12px;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
}

.confirm:disabled{
    opacity:.6;
}

.cancel{
    flex:1;
    border:none;
    background:#252d3d;
    color:#fff;
    padding:12px;
    border-radius:10px;
    cursor:pointer;
}

.message{
    margin-top:12px;
    padding:10px;
    border-radius:10px;
    display:none;
    text-align:center;
    line-height:1.6;
}

.success{
    background:#103b2b;
    color:#65e6ae;
}

.fail{
    background:#421b22;
    color:#ff8995;
}

footer{
    text-align:center;
    color:#687386;
    padding:25px 15px;
    border-top:1px solid #1c2435;
}


/* =========================
   استجابة الهاتف
========================= */

@media(max-width:500px){

    .logo{
        font-size:20px;
    }

    .back,
    .cart-button{
        padding:8px 10px;
        font-size:12px;
    }

    .products{
        grid-template-columns:repeat(2,1fr);
        gap:10px;
    }

    .product{
        padding:10px;
    }

    .product-image-box{
        height:110px;
    }

    .product h3{
        font-size:14px;
    }

    .price{
        font-size:15px;
    }

}

</style>

</head>

<script>


/* =====================================
   Supabase
===================================== */

const SUPABASE_URL =
"https://uwmrzvsygeoequscpinx.supabase.co";


const SUPABASE_KEY =
"sb_publishable_26b3KzpWkLqltiLTyTSpIg_gTgexDts";


const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);



/* =====================================
   قراءة اللعبة
===================================== */

const params =
new URLSearchParams(
    window.location.search
);


const gameKey =
params.get("g");



let currentUser = null;

let currentBalance = 0;

let cart = [];



/* =====================================
   أسماء الألعاب
===================================== */

const gameNames = {

    freefire:"Free Fire",

    pubg:"PUBG Mobile",

    codm:"Call of Duty Mobile",

    efootball:"eFootball",

    jawaker:"Jawaker",

    mobilelegends:"Mobile Legends",

    yallaludo:"Yalla Ludo",

    tiktok:"TikTok",

    googleplay:"Google Play",

    itunes:"iTunes",

    playstation:"PlayStation",

    xbox:"Xbox",

    razergold:"Razer Gold",

    netflix:"Netflix",

    visa:"Visa",

    mastercard:"Mastercard",

    zain:"Zain",

    mtn:"MTN",

    sudani:"Sudani",

    cashi:"Cashi",

    starlink:"Starlink",

    katrocard:"KATRO CARD",

    pyypl:"Pyypl"

};



document.getElementById("gameName")
.textContent =
gameNames[gameKey]
|| "منتجات KATRO SHOP";



/* =====================================
   تحميل السلة
===================================== */

function loadCart(){

    try{

        const saved =
            localStorage.getItem(
                "katro_cart"
            );


        if(saved){

            const parsed =
                JSON.parse(saved);


            if(Array.isArray(parsed)){

                cart = parsed;

            }

        }

    }catch(error){

        console.error(
            "Cart Load Error:",
            error
        );

        cart = [];

    }


    updateCartUI();

}



/* =====================================
   حفظ السلة
===================================== */

function saveCart(){

    localStorage.setItem(
        "katro_cart",
        JSON.stringify(cart)
    );

    updateCartUI();

}



/* =====================================
   تحديث عداد السلة
===================================== */

function updateCartUI(){

    const count =
        cart.reduce(
            (total,item) =>
                total + Number(item.quantity || 0),
            0
        );


    const badge =
        document.getElementById(
            "cartCount"
        );


    badge.textContent =
        count;


    badge.style.display =
        count > 0
        ? "flex"
        : "none";

}



/* =====================================
   إضافة للسلة
===================================== */

function addToCart(product){

    if(!currentUser){

        alert(
            "يجب تسجيل الدخول أولاً"
        );

        window.location.href =
            "login.html";

        return;

    }


    const existing =
        cart.find(
            item =>
                Number(item.id)
                === Number(product.id)
        );


    if(existing){

        existing.quantity =
            Number(existing.quantity || 1)
            + 1;

    }else{

        cart.push({

            id:product.id,

            game_key:product.game_key,

            name:product.name,

            description:
                product.description || "",

            price:Number(product.price),

            image_url:
                product.image_url || "",

            quantity:1

        });

    }


    saveCart();


    alert(
        "تمت إضافة المنتج إلى السلة 🛒"
    );

}



/* =====================================
   فتح السلة
===================================== */

function openCart(){

    renderCart();

    document.getElementById(
        "cartModal"
    ).style.display = "flex";

}



/* =====================================
   إغلاق السلة
===================================== */

function closeCart(){

    document.getElementById(
        "cartModal"
    ).style.display = "none";

}



/* =====================================
   عرض السلة
===================================== */

function renderCart(){

    const box =
        document.getElementById(
            "cartItems"
        );


    const totalBox =
        document.getElementById(
            "cartTotal"
        );


    const buttons =
        document.getElementById(
            "cartButtons"
        );


    if(!cart.length){

        box.innerHTML = `

            <div class="cart-empty">

                🛒 السلة فارغة

                <br><br>

                أضف المنتجات التي تريد شراءها.

            </div>

        `;


        totalBox.style.display =
            "none";


        buttons.style.display =
            "none";


        return;

    }


    box.innerHTML = "";


    let total = 0;


    cart.forEach(
        (item,index) => {

            const quantity =
                Number(item.quantity || 1);


            const itemTotal =
                Number(item.price)
                * quantity;


            total += itemTotal;


            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "cart-item";


            div.innerHTML = `

                <div class="cart-item-top">

                    <div class="cart-item-name">

                        ${escapeHtml(
                            item.name
                        )}

                    </div>

                    <div class="cart-item-price">

                        ${itemTotal.toLocaleString("ar-EG")}

                        ج.س

                    </div>

                </div>


                <div class="cart-controls">

                    <div class="quantity-controls">

                        <button
                            class="quantity-btn"
                            onclick="changeQuantity(${index},-1)">

                            −

                        </button>


                        <span class="quantity-number">

                            ${quantity}

                        </span>


                        <button
                            class="quantity-btn"
                            onclick="changeQuantity(${index},1)">

                            +

                        </button>

                    </div>


                    <button
                        class="remove-btn"
                        onclick="removeFromCart(${index})">

                        حذف

                    </button>

                </div>

            `;


            box.appendChild(div);

        }
    );


    document.getElementById(
        "cartTotalPrice"
    ).textContent =
        total.toLocaleString("ar-EG");


    totalBox.style.display =
        "block";


    buttons.style.display =
        "flex";

}



/* =====================================
   تغيير الكمية
===================================== */

function changeQuantity(
    index,
    change
){

    if(!cart[index]){

        return;

    }


    cart[index].quantity =
        Number(cart[index].quantity || 1)
        + change;


    if(cart[index].quantity <= 0){

        cart.splice(
            index,
            1
        );

    }


    saveCart();

    renderCart();

}



/* =====================================
   حذف منتج
===================================== */

function removeFromCart(index){

    cart.splice(
        index,
        1
    );

    saveCart();

    renderCart();

}



/* =====================================
   فتح صفحة الدفع
===================================== */

function openCheckout(){

    if(!cart.length){

        alert(
            "السلة فارغة"
        );

        return;

    }


    if(!currentUser){

        alert(
            "يجب تسجيل الدخول أولاً"
        );

        window.location.href =
            "login.html";

        return;

    }


    let total = 0;


    cart.forEach(item => {

        total +=
            Number(item.price)
            *
            Number(item.quantity || 1);

    });


    document.getElementById(
        "checkoutTotal"
    ).textContent =
        total.toLocaleString("ar-EG")
        + " ج.س";


    document.getElementById(
        "playerId"
    ).value = "";


    document.getElementById(
        "accountType"
    ).value = "";


    document.getElementById(
        "accountInfo"
    ).value = "";


    document.getElementById(
        "contactPhone"
    ).value = "";


    hideMessage();


    closeCart();


    document.getElementById(
        "checkoutModal"
    ).style.display =
        "flex";

}



/* =====================================
   إغلاق الدفع
===================================== */

function closeCheckout(){

    document.getElementById(
        "checkoutModal"
    ).style.display =
        "none";

}



/* =====================================
   التحقق من تسجيل الدخول
===================================== */

async function checkUser(){

    const {
        data,
        error
    } =
    await supabaseClient
    .auth
    .getSession();


    if(error){

        console.error(error);

        return;

    }


    if(!data.session){

        currentUser = null;

        document.getElementById(
            "balanceBox"
        ).style.display =
            "none";

        return;

    }


    currentUser =
        data.session.user;


    document.getElementById(
        "balanceBox"
    ).style.display =
        "block";


    await loadBalance();

}



/* =====================================
   تحميل الرصيد
===================================== */

async function loadBalance(){

    if(!currentUser){

        return;

    }


    const {
        data,
        error
    } =
    await supabaseClient
    .from("wallets")
    .select("balance")
    .eq(
        "user_id",
        currentUser.id
    )
    .single();


    if(error){

        console.error(error);

        return;

    }


    currentBalance =
        Number(
            data.balance || 0
        );


    document.getElementById(
        "balance"
    ).textContent =
        currentBalance.toLocaleString(
            "ar-EG"
        );

}



/* =====================================
   تحميل المنتجات
===================================== */

async function loadProducts(){

    const productsBox =
        document.getElementById(
            "products"
        );


    if(!gameKey){

        productsBox.innerHTML =
            '<div class="error">لم يتم تحديد المنتج</div>';

        return;

    }


    const {
        data,
        error
    } =
    await supabaseClient
    .from("products")
    .select("*")
    .eq(
        "game_key",
        gameKey
    )
    .eq(
        "active",
        true
    )
    .order("id");


    if(error){

        console.error(error);

        productsBox.innerHTML =
            '<div class="error">حدث خطأ أثناء تحميل المنتجات</div>';

        return;

    }


    if(!data || !data.length){

        productsBox.innerHTML =
            '<div class="empty">لا توجد منتجات متاحة حالياً</div>';

        return;

    }


    productsBox.innerHTML = "";


    data.forEach(product => {

        const card =
            document.createElement(
                "div"
            );


        card.className =
            "product";


        const image =
            product.image_url
            ? String(product.image_url)
            : "";


        const imageHTML =
            image
            ? `

                <img
                    src="${escapeHtml(image)}"
                    alt="${escapeHtml(product.name)}"
                    onerror="this.style.display='none';this.nextElementSibling.style.display='flex';"
                >

                <div
                    class="image-fallback"
                    style="display:none;">
                    ${getGameEmoji(gameKey)}
                </div>

            `
            : `

                <div class="image-fallback">

                    ${getGameEmoji(gameKey)}

                </div>

            `;


        card.innerHTML = `

            <div class="product-image-box">

                ${imageHTML}

            </div>


            <h3>

                ${escapeHtml(
                    product.name
                )}

            </h3>


            <div class="description">

                ${escapeHtml(
                    product.description || ""
                )}

            </div>


            <div class="price">

                ${Number(
                    product.price
                ).toLocaleString("ar-EG")}

                ج.س

            </div>


            <button
                class="buy-btn"
                onclick='addToCart(${JSON.stringify(product).replace(/'/g,"&#039;")})'>

                🛒 إضافة إلى السلة

            </button>

        `;


        productsBox.appendChild(
            card
        );

    });

}

/* =====================================
   تنفيذ الشراء
===================================== */

async function confirmPurchase(){

    if(!currentUser){

        showMessage(
            "يجب تسجيل الدخول أولاً",
            false
        );

        return;

    }


    if(!cart.length){

        showMessage(
            "السلة فارغة",
            false
        );

        return;

    }


    const playerId =
        document.getElementById(
            "playerId"
        )
        .value
        .trim();


    const accountType =
        document.getElementById(
            "accountType"
        )
        .value
        .trim();


    const accountInfo =
        document.getElementById(
            "accountInfo"
        )
        .value
        .trim();


    const contactPhone =
        document.getElementById(
            "contactPhone"
        )
        .value
        .trim();


    if(!contactPhone){

        showMessage(
            "أدخل رقم الهاتف للتواصل",
            false
        );

        return;

    }


    /*
       تجميع معلومات الحساب
       داخل العمود الموجود عندك
       account_info
    */

    let finalAccountInfo = "";


    if(accountType){

        finalAccountInfo +=
            "نوع الحساب: "
            + accountType;

    }


    if(accountInfo){

        if(finalAccountInfo){

            finalAccountInfo +=
                " | ";

        }

        finalAccountInfo +=
            "معلومات إضافية: "
            + accountInfo;

    }


    const total =
        cart.reduce(
            (sum,item) =>
                sum
                +
                Number(item.price)
                *
                Number(item.quantity || 1),
            0
        );


    if(currentBalance < total){

        showMessage(
            "رصيدك غير كافٍ. يرجى شحن المحفظة أولاً.",
            false
        );

        return;

    }


    const button =
        document.getElementById(
            "confirmBtn"
        );


    button.disabled =
        true;


    button.textContent =
        "جاري تنفيذ الطلب...";


    hideMessage();


    try{

        /*
           تنفيذ المنتجات واحداً واحداً
        */

        const createdOrders = [];


        for(
            const item
            of cart
        ){

            const quantity =
                Number(
                    item.quantity || 1
                );


            /*
               تنفيذ الكمية المطلوبة
               كطلبات منفصلة
            */

            for(
                let i = 0;
                i < quantity;
                i++
            ){

                const {
                    data,
                    error
                } =
                await supabaseClient.rpc(

                    "create_order_and_charge",

                    {

                        p_product_id:
                            item.id,

                        p_player_id:
                            playerId || null,

                        p_account_info:
                            finalAccountInfo || null,

                        p_contact_phone:
                            contactPhone || null,

                        p_quantity:
                            1

                    }

                );


                if(error){

                    throw error;

                }


                if(
                    !data
                    ||
                    !data.success
                ){

                    throw new Error(
                        "تعذر تنفيذ أحد الطلبات"
                    );

                }


                createdOrders.push(
                    data.order_number
                );


                currentBalance =
                    Number(
                        data.new_balance
                    );

            }

        }


        document.getElementById(
            "balance"
        ).textContent =
            currentBalance.toLocaleString(
                "ar-EG"
            );


        /*
           تفريغ السلة بعد نجاح الطلبات
        */

        cart = [];

        saveCart();


        let orderText =
            createdOrders.join(" ، #");


        showMessage(

            "تم الشراء بنجاح ✅\n"
            +
            "أرقام الطلبات: #"
            +
            orderText,

            true

        );


        setTimeout(
            () => {

                closeCheckout();

            },
            3000
        );


    }catch(error){

        console.error(
            "Purchase Error:",
            error
        );


        let message =
            error.message
            ||
            "حدث خطأ أثناء عملية الشراء";


        if(
            message.includes(
                "رصيدك غير كافٍ"
            )
        ){

            message =
                "رصيدك غير كافٍ";

        }


        if(
            message.includes(
                "يجب تسجيل الدخول"
            )
        ){

            message =
                "يجب تسجيل الدخول أولاً";

        }


        showMessage(
            message,
            false
        );


    }finally{

        button.disabled =
            false;


        button.textContent =
            "تأكيد الشراء";

    }

}



/* =====================================
   الرسائل
===================================== */

function showMessage(
    message,
    success
){

    const box =
        document.getElementById(
            "modalMessage"
        );


    box.textContent =
        message;


    box.className =
        "message "
        +
        (
            success
            ? "success"
            : "fail"
        );


    box.style.display =
        "block";

}



function hideMessage(){

    const box =
        document.getElementById(
            "modalMessage"
        );


    box.style.display =
        "none";


    box.textContent =
        "";

}



/* =====================================
   حماية النصوص
===================================== */

function escapeHtml(value){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}
