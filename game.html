<!DOCTYPE html><html dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المنتج</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
<style>*{font-family:Tajawal;box-sizing:border-box}body{margin:0;background:#f8f8ff;padding-bottom:90px}.top{background:#6c3cff;color:#fff;padding:10px 12px;display:flex;justify-content:space-between}.price{color:#6c3cff;font-weight:800;text-align:center;padding:10px}.opt{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}.opt label{border:1px solid #ddd;border-radius:10px;padding:10px;text-align:center;background:#fff;cursor:pointer}.opt input{display:none}.opt input:checked+label{border-color:#6c3cff;background:#ede6ff}
.detail{background:#efeef6;margin:12px;border-radius:14px;padding:12px}.detail.row{display:flex;justify-content:space-between;background:#fff;border-radius:10px;padding:10px;margin-top:8px}
.inp{width:100%;padding:12px;border-radius:10px;border:1px solid #ddd;margin:8px 0}
.btn{width:94%;margin:10px auto;display:block;background:linear-gradient(90deg,#6c3cff,#ff8a00);color:#fff;border:none;padding:14px;border-radius:14px;font-weight:800;font-size:16px}
.bottom{position:fixed;bottom:10px;left:10px;right:10px;background:#1a1333;border-radius:30px;display:flex;justify-content:space-around;padding:10px;z-index:100}
.bottom a{color:#8a8a9a;text-decoration:none;text-align:center;font-size:12px;display:flex;flex-direction:column;align-items:center}
</style></head><body>
<div class="top"><div>☰</div><div>ALHBANI SHOP</div><div>🛒</div></div>
<h3 id="gtitle" style="padding:12px">شحن فري فاير مباشر 24 ساعة</h3>
<div class="price" id="prange">ج.س. 2,900 - ج.س. 162,000</div>
<p style="text-align:center;font-size:13px">تسليم فوري ⚡</p>
<h4 style="padding:12px">قيمة البطاقة</h4>
<div class="opt" id="options"></div>
<div class="detail"><b>تفاصيل الاختيار</b><div class="row"><span>السعر</span><span id="selPrice">-</span></div><button style="width:100%;margin-top:8px;background:#6c3cff;color:#fff;border:none;padding:8px;border-radius:8px" onclick="document.getElementById('selPrice').innerText='-'">إعادة التعيين</button></div>
<div style="padding:12px">
<label>* معرف اللاعب (ID)</label><input id="pid" class="inp" placeholder="مثال 12345678">
<label>* واتساب للتواصل</label><input id="wpp" class="inp" placeholder="09xxxxxxxx">
<button class="btn" onclick="buy()">إضافة إلى السلة - شراء فوري</button>
</div>
<div class="bottom"><a href="wallet.html"><div>👤</div>دخول</a><a href="wallet.html"><div>🧾</div>الطلبات</a><a href="wallet.html"><div>💳</div>المحفظة</a><a href="index.html"><div>🏠</div>الرئيسية</a></div>
<script>
let params=new URLSearchParams(location.search); let g=params.get('g')||'freefire';
let packs={freefire:[{n:'110 جوهرة',p:2900},{n:'231 جوهرة',p:5800},{n:'583 جوهرة',p:11600},{n:'1180 جوهرة',p:22000},{n:'عضوية أسبوعية',p:6000},{n:'عضوية شهرية',p:28000}],pubg:[{n:'60 UC',p:3500},{n:'325 UC',p:17000},{n:'660 UC',p:34000}],tiktok:[{n:'350 عملة',p:32500},{n:'700 عملة',p:65000},{n:'1400 عملة',p:130000}],playstation:[{n:'10$ PSN',p:45000},{n:'25$ PSN',p:110000}]};
let cur=packs[g]||packs.freefire;
document.getElementById('gtitle').innerText=g=='freefire'?'شحن فري فاير مباشر 24ساعة':g=='pubg'?'شحن ببجي UC':g=='tiktok'?'عملات تيك توك':'بلايستيشن';
let html='';cur.forEach((x,i)=>{html+=`<input type=radio name=pack id=p${i} onchange="document.getElementById('selPrice').innerText='${x.p} ج.س';window.sel=x"><label for=p${i}>${x.n}</label>`});document.getElementById('options').innerHTML=html;
function buy(){
let id=document.getElementById('pid').value; if(!id){alert('اكتب الـID');return}
if(!window.sel){alert('اختار الباقة');return}
let wallet=parseInt(localStorage.getItem('wallet')||0);
if(wallet<window.sel.p){alert('رصيد محفظتك غير كافي، اشحن المحفظة أولا'); location.href='wallet.html'; return}
localStorage.setItem('wallet',wallet-window.sel.p);
let orders=JSON.parse(localStorage.getItem('orders')||'[]');
orders.push({pack:window.sel.n,price:window.sel.p,id:id,status:'قيد التنفيذ',date:new Date().toLocaleString()});
localStorage.setItem('orders',JSON.stringify(orders));
alert('تم الشراء بنجاح، تابع طلباتك'); location.href='wallet.html';
}
</script></body></html>
