<!DOCTYPE html><html dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>شحن المحفظة</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@700;800&display=swap');
*{font-family:'Tajawal';box-sizing:border-box;margin:0}body{background:#f4f0ff}
.top{background:#6a33ff;color:#fff;padding:12px;display:flex;justify-content:space-between}
.box{background:#fff;margin:12px;border-radius:16px;padding:14px;box-shadow:0 4px 12px #0001}
.inp{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin:6px 0;background:#faf8ff}
.bank{border:2px solid #6a33ff;background:#f0eaff;border-radius:12px;padding:12px;margin:8px 0}
.btn{width:100%;background:linear-gradient(90deg,#6a33ff,#ff8a00);color:#fff;border:none;padding:14px;border-radius:14px;font-weight:800;font-size:16px}
</style></head><body>
<div class="top"><b>KATRO SHOP</b><span>شحن المحفظة</span></div>
<div class="box">
<b>تفاصيل الدفع - حسابك البنكي الرسمي</b><br><br>
<div class="bank">
<b>🏦 بنك الخرطوم - بنكك</b><br>
اسم الحساب: <b>خالد حسين محمد حامد</b><br>
رقم الحساب: <b style="font-size:18px;background:#ffe58a;padding:4px 10px;border-radius:8px">2673843</b> <button onclick="navigator.clipboard.writeText('2673843');alert('تم نسخ رقم الحساب 2673843')">📋 نسخ</button><br>
<small>انسخ الرقم وحول عليه وارفع الاشعار</small>
</div>
</div>

<div class="box">
<b>تفاصيل الفاتورة</b>
<input id="fn" class="inp" placeholder="الاسم الأول *">
<input id="ln" class="inp" placeholder="الاسم الأخير *">
<input id="ph" class="inp" placeholder="الهاتف * 0100454995" value="0100454995">
<input id="em" class="inp" placeholder="البريد *">
<input id="am" class="inp" type="number" placeholder="المبلغ المراد شحنه - مثلا 10000" value="10000">
<b>ارفق صورة الإشعار *</b><input type="file" class="inp">
<br><label><input type="checkbox" checked> أوافق على الشروط</label><br><br>
<button class="btn" onclick="confirmOrder()">تأكيد الطلب ✅</button>
</div>

<script>
function confirmOrder(){
let am=document.getElementById('am').value;
if(!am){alert('اكتب المبلغ');return}
// كل عملية برقم براها عشوائي
let orderId = Math.floor(60000 + Math.random()*39999);
let date = new Date().toLocaleDateString('ar-EG');
let pend=JSON.parse(localStorage.getItem('pending')||'[]');
pend.push({
id:orderId,
amount:am,
bank:'بنك الخرطوم',
bankAcc:'2673843 - خالد حسين محمد حامد',
date:date,
status:'معلق - بانتظار التأكيد',
email:document.getElementById('em').value||localStorage.getItem('user_email')
});
localStorage.setItem('pending',JSON.stringify(pend));

document.body.innerHTML=`
<div style="padding:16px;text-align:center">
<div style="background:#6a33ff;color:#fff;border-radius:18px;padding:20px">
<div style="width:64px;height:64px;background:#fff;border-radius:50%;margin:0 auto;display:grid;place-items:center;font-size:32px;color:#6a33ff">✓</div>
<h2 style="margin-top:10px">شكراً لطلبك!</h2>
<p>تم استلام طلبك بنجاح<br>رقم الطلب الخاص بك: <b>#${orderId}</b></p>
</div>
<div style="background:#fff;border-radius:14px;padding:14px;margin-top:12px;border:1px dashed #6a33ff;text-align:right">
<b>تفاصيل الطلب #${orderId}</b><br>
التاريخ: ${date}<br>
المبلغ: ${am} ج.س<br>
محول إلى: 2673843 - خالد حسين محمد حامد<br>
الحالة: معلق<br><br>
<small>سيتم تأكيد رصيدك بعد مراجعة الإشعار في لوحة الأدمن</small>
</div><br>
<button onclick="location.href='wallet.html'" style="width:100%;background:#6a33ff;color:#fff;border:none;padding:14px;border-radius:14px">الذهاب لطلباتي</button>
</div>`;
}
</script>
</body></html>
