<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Tahoma,sans-serif;
    background:#f5f6f8;
    color:#222;
    padding-bottom:100px;
}

.header{
    height:70px;
    background:#080b12;
    color:white;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
}

.logo{
    font-size:22px;
    font-weight:bold;
}

.back{
    color:white;
    text-decoration:none;
    font-size:25px;
}

.container{
    max-width:650px;
    margin:auto;
    padding:18px;
}

.card{
    background:white;
    border-radius:24px;
    padding:22px;
    box-shadow:0 5px 25px rgba(0,0,0,.07);
}

.title{
    font-size:27px;
    font-weight:bold;
}

.description{
    color:#777;
    line-height:1.8;
    margin:8px 0 20px;
}

/* PAYMENT METHOD */

.payment-title{
    font-size:19px;
    font-weight:bold;
    margin-bottom:10px;
}

.payment-select{
    width:100%;
    border:1px solid #ddd;
    border-radius:15px;
    padding:15px;
    font-size:17px;
    background:white;
    outline:none;
}

/* ACCOUNT */

.account-box{
    margin-top:18px;
    padding:18px;
    background:#f7f8fa;
    border-radius:18px;
    border:1px solid #eee;
}

.account-title{
    font-size:20px;
    font-weight:bold;
    margin-bottom:15px;
}

.account-row{
    padding:8px 0;
}

.account-label{
    color:#777;
    font-size:14px;
}

.account-value{
    font-size:18px;
    font-weight:bold;
    margin-top:4px;
}

.copy-btn{
    margin-top:8px;
    border:0;
    border-radius:10px;
    padding:8px 12px;
    background:#080b12;
    color:white;
    cursor:pointer;
}

/* FORM */

label{
    display:block;
    margin:17px 0 8px;
    font-weight:bold;
}

input{
    width:100%;
    padding:15px;
    border:1px solid #ddd;
    border-radius:14px;
    background:#fafafa;
    font-size:16px;
    outline:none;
}

input:focus{
    border-color:#00a86b;
}

/* FILE */

.file-box{
    border:2px dashed #ccc;
    border-radius:16px;
    padding:20px;
    text-align:center;
    margin-top:8px;
}

.file-box input{
    border:0;
    background:none;
}

/* TERMS */

.terms-box{
    margin-top:20px;
    padding:16px;
    background:#f8f8f8;
    border-radius:14px;
    border:1px solid #eee;
}

.terms-label{
    display:flex;
    align-items:flex-start;
    gap:10px;
    cursor:pointer;
    line-height:1.8;
    margin:0;
}

.terms-label input{
    width:20px;
    height:20px;
    margin-top:4px;
    flex-shrink:0;
}

.terms-label b{
    color:red;
}

/* SUBMIT */

.submit-btn{
    width:100%;
    margin-top:20px;
    padding:16px;
    border:0;
    border-radius:15px;
    background:#00a86b;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

.submit-btn:disabled{
    opacity:.6;
}

/* MESSAGE */

.message{
    display:none;
    margin-top:15px;
    padding:14px;
    border-radius:12px;
    text-align:center;
}

.success{
    display:block;
    color:#087443;
    background:#e7fff2;
}

.error{
    display:block;
    color:#a00000;
    background:#ffe9e9;
}

/* WHATSAPP */

.whatsapp-float{
    position:fixed;
    left:18px;
    bottom:95px;
    width:62px;
    height:62px;
    border-radius:50%;
    background:#25D366;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 5px 20px rgba(0,0,0,.25);
    z-index:9999;
}

.whatsapp-float svg{
    width:38px;
    height:38px;
    fill:white;
}

/* NAV */

.bottom-nav{
    position:fixed;
    bottom:10px;
    left:14px;
    right:14px;
    height:72px;
    background:#0b081b;
    border-radius:28px;
    display:flex;
    justify-content:space-around;
    align-items:center;
    z-index:9998;
}

.nav-item{
    color:#aaa;
    text-decoration:none;
    text-align:center;
    font-size:12px;
}

.nav-icon{
    display:block;
    font-size:23px;
    margin-bottom:4px;
}

.nav-item.active{
    color:#a855f7;
}

</style>

<script>

const SUPABASE_URL =
"https://uwmrzvsygeoequscpinx.supabase.co";

const SUPABASE_KEY =
"sb_publishable_26b3KZpWkLqltiLTyTSpIg_gTgexDts";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


let currentUser = null;


const paymentAccounts = {

    Bankak:{
        title:"🏦 بنك الخرطوم - بنكك",
        name:"خالد حسين محمد حامد",
        number:"2673843",
        note:
        "قم بالتحويل إلى حساب بنك الخرطوم أعلاه، ثم ارفع صورة إشعار التحويل."
    },

    MyCashi:{
        title:"💳 ماي كاشي",
        name:"محمد خالد حسين محمد",
        number:"402993679",
        note:
        "قم بالتحويل إلى حساب ماي كاشي أعلاه، ثم ارفع صورة إشعار التحويل."
    },

    Fawry:{
        title:"💰 فوري",
        name:"",
        number:"",
        note:
        "بيانات فوري غير مضافة حالياً."
    }

};


async function init(){

    const {
        data:{
            user
        }
    } =
    await supabaseClient.auth.getUser();


    if(!user){

        location.href =
        "login.html";

        return;
    }

    currentUser = user;

}


function showPaymentAccount(){

    const method =
    document.getElementById(
        "paymentMethod"
    ).value;

    const box =
    document.getElementById(
        "accountBox"
    );


    if(!method){

        box.style.display =
        "none";

        return;
    }


    const account =
    paymentAccounts[method];


    box.style.display =
    "block";


    document.getElementById(
        "accountTitle"
    ).textContent =
    account.title;


    document.getElementById(
        "accountName"
    ).textContent =
    account.name ||
    "غير مضاف";


    document.getElementById(
        "accountNumber"
    ).textContent =
    account.number ||
    "غير مضاف";


    document.getElementById(
        "accountNote"
    ).textContent =
    account.note;


    const copy =
    document.getElementById(
        "copyBtn"
    );


    if(account.number){

        copy.style.display =
        "inline-block";

    }else{

        copy.style.display =
        "none";

    }

}


async function copyAccountNumber(){

    const number =
    document.getElementById(
        "accountNumber"
    ).textContent;


    if(!number ||
       number === "غير مضاف"){

        return;
    }


    try{

        await navigator.clipboard.writeText(
            number
        );

        alert(
            "تم نسخ رقم الحساب"
        );

    }catch(error){

        console.error(error);

    }

}


async function submitTopup(){

    const method =
    document.getElementById(
        "paymentMethod"
    ).value;

    const amount =
    Number(
        document.getElementById(
            "amount"
        ).value
    );

    const senderName =
    document.getElementById(
        "senderName"
    ).value.trim();

    const senderPhone =
    document.getElementById(
        "senderPhone"
    ).value.trim();

    const proof =
    document.getElementById(
        "proof"
    ).files[0];

    const agree =
    document.getElementById(
        "agreeTerms"
    ).checked;

    const button =
    document.getElementById(
        "submitBtn"
    );


    if(!method){

        showMessage(
            "اختر طريقة الدفع أولاً",
            false
        );

        return;
    }


    if(!amount || amount <= 0){

        showMessage(
            "أدخل مبلغاً صحيحاً",
            false
        );

        return;
    }


    if(!senderName){

        showMessage(
            "أدخل اسم المرسل",
            false
        );

        return;
    }


    if(!senderPhone){

        showMessage(
            "أدخل رقم هاتف المرسل",
            false
        );

        return;
    }


    if(!proof){

        showMessage(
            "يرجى رفع صورة إشعار التحويل",
            false
        );

        return;
    }


    if(!agree){

        showMessage(
            "يجب الموافقة على الشروط والأحكام أولاً حتى تتمكن من إرسال الطلب.",
            false
        );

        document
        .getElementById(
            "agreeTerms"
        )
        .focus();

        return;
    }


    button.disabled = true;

    button.textContent =
    "جاري إرسال الطلب...";


    try{

        const fileExt =
        proof.name
        .split(".")
        .pop()
        .toLowerCase();


        const fileName =
        currentUser.id +
        "_" +
        Date.now() +
        "." +
        fileExt;


        const filePath =
        fileName;


        const {
            error:
            uploadError
        } =
        await supabaseClient
        .storage
        .from("payment-proofs")
        .upload(
            filePath,
            proof,
            {
                upsert:false,
                contentType:
                proof.type
            }
        );


        if(uploadError){

            throw uploadError;
        }


        const {
            data:
            publicData
        } =
        supabaseClient
        .storage
        .from("payment-proofs")
        .getPublicUrl(
            filePath
        );


        const proofUrl =
        publicData.publicUrl;


        const {
            data,
            error
        } =
        await supabaseClient
        .from("topup_requests")
        .insert({

            user_id:
            currentUser.id,

            amount:
            amount,

            payment_method:
            method,

            sender_name:
            senderName,

            sender_phone:
            senderPhone,

            proof_url:
            proofUrl,

            status:
            "pending"

        })
        .select()
        .single();


        if(error){

            throw error;
        }


        showMessage(
            "تم إرسال طلب الشحن بنجاح. سيتم مراجعته من الإدارة.",
            true
        );


        document.getElementById(
            "amount"
        ).value = "";

        document.getElementById(
            "senderName"
        ).value = "";

        document.getElementById(
            "senderPhone"
        ).value = "";

        document.getElementById(
            "proof"
        ).value = "";

        document.getElementById(
            "agreeTerms"
        ).checked = false;


    }catch(error){

        console.error(error);

        showMessage(
            error.message ||
            "حدث خطأ أثناء إرسال الطلب",
            false
        );

    }


    button.disabled = false;

    button.textContent =
    "تأكيد طلب الشحن";

}


function showMessage(
    text,
    success
){

    const box =
    document.getElementById(
        "message"
    );

    box.className =
    "message " +
    (
        success
        ? "success"
        : "error"
    );

    box.textContent =
    text;

}


init();

</script>
