<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://uwmrzvsygeoequscpinx.supabase.co";

const SUPABASE_KEY =
"sb_publishable_26b3KZpWkLqltiLTyTSpIg_gTgexDts";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


let currentUser = null;


function showMessage(text,type){

    const message =
        document.getElementById("message");

    message.textContent = text;

    message.className =
        "message " + type;

}


async function checkLogin(){

    const {
        data,
        error
    } =
    await supabaseClient
        .auth
        .getUser();


    if(error || !data.user){

        showMessage(
            "يجب تسجيل الدخول أولاً.",
            "error"
        );

        document.getElementById("saveBtn")
            .disabled = true;

        return false;
    }


    currentUser = data.user;

    return true;

}


async function changePassword(){

    const button =
        document.getElementById("saveBtn");


    const currentPassword =
        document
        .getElementById("currentPassword")
        .value;


    const newPassword =
        document
        .getElementById("newPassword")
        .value;


    const confirmPassword =
        document
        .getElementById("confirmPassword")
        .value;


    document
        .getElementById("message")
        .className = "message";


    if(!currentPassword){

        showMessage(
            "أدخل كلمة المرور الحالية.",
            "error"
        );

        return;
    }


    if(!newPassword){

        showMessage(
            "أدخل كلمة المرور الجديدة.",
            "error"
        );

        return;
    }


    if(newPassword.length < 6){

        showMessage(
            "كلمة المرور الجديدة يجب أن تكون 6 أحرف على الأقل.",
            "error"
        );

        return;
    }


    if(newPassword !== confirmPassword){

        showMessage(
            "تأكيد كلمة المرور غير مطابق.",
            "error"
        );

        return;
    }


    if(currentPassword === newPassword){

        showMessage(
            "كلمة المرور الجديدة يجب أن تكون مختلفة عن الحالية.",
            "error"
        );

        return;
    }


    button.disabled = true;

    button.textContent =
        "جاري التحقق...";


    try{

        /*
         * أولاً نتحقق من كلمة المرور الحالية
         * عن طريق تسجيل الدخول بالبريد وكلمة المرور.
         */

        const {
            error: loginError
        } =
        await supabaseClient.auth.signInWithPassword({

            email:
                currentUser.email,

            password:
                currentPassword

        });


        if(loginError){

            showMessage(
                "كلمة المرور الحالية غير صحيحة.",
                "error"
            );

            return;
        }


        button.textContent =
            "جاري تغيير كلمة المرور...";


        const {
            error: updateError
        } =
        await supabaseClient.auth.updateUser({

            password:
                newPassword

        });


        if(updateError){

            console.error(
                "Password Update Error:",
                updateError
            );

            showMessage(
                updateError.message ||
                "تعذر تغيير كلمة المرور.",
                "error"
            );

            return;
        }


        showMessage(
            "تم تغيير كلمة المرور بنجاح.",
            "success"
        );


        document
            .getElementById("currentPassword")
            .value = "";


        document
            .getElementById("newPassword")
            .value = "";


        document
            .getElementById("confirmPassword")
            .value = "";


    }catch(error){

        console.error(error);

        showMessage(
            "حدث خطأ غير متوقع.",
            "error"
        );

    }finally{

        button.disabled = false;

        button.textContent =
            "تغيير كلمة المرور";

    }

}


async function init(){

    const loggedIn =
        await checkLogin();


    if(!loggedIn){
        return;
    }

}


init();

</script>
