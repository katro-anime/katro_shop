<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>تحويل الرصيد | KATRO SHOP</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Tahoma,sans-serif;
    background:#080b12;
    color:#fff;
    min-height:100vh;
}

header{
    height:70px;
    background:#0d111c;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    border-bottom:1px solid #20283a;
}

.logo{
    font-size:22px;
    font-weight:bold;
    color:#00b7ff;
}

.home-btn{
    width:42px;
    height:42px;
    border-radius:12px;
    background:#151c2b;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    font-size:21px;
}

.container{
    width:min(500px,92%);
    margin:30px auto 120px;
}

.card{
    background:#101522;
    border:1px solid #20283a;
    border-radius:22px;
    padding:22px;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
}

.title{
    text-align:center;
    font-size:25px;
    font-weight:bold;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#9da8ba;
    font-size:14px;
    margin-bottom:25px;
}

.balance-box{
    background:linear-gradient(135deg,#161d31,#101522);
    border:1px solid #27334b;
    border-radius:17px;
    padding:18px;
    text-align:center;
    margin-bottom:22px;
}

.balance-label{
    color:#9da8ba;
    font-size:14px;
    margin-bottom:8px;
}

.balance{
    color:#00d9ff;
    font-size:27px;
    font-weight:bold;
}

.form-group{
    margin-bottom:18px;
}

label{
    display:block;
    margin-bottom:8px;
    font-size:14px;
    color:#dce3ef;
}

input,
textarea{
    width:100%;
    border:none;
    outline:none;
    background:#080d17;
    border:1px solid #29354b;
    color:#fff;
    border-radius:13px;
    padding:14px;
    font-size:16px;
    direction:rtl;
}

input:focus,
textarea:focus{
    border-color:#00b7ff;
}

textarea{
    min-height:90px;
    resize:vertical;
}

.send-btn{
    width:100%;
    border:none;
    border-radius:14px;
    padding:15px;
    background:linear-gradient(135deg,#00b7ff,#0077ff);
    color:#fff;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    margin-top:5px;
}

.send-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.message{
    display:none;
    margin-top:18px;
    padding:13px;
    border-radius:12px;
    text-align:center;
    font-size:14px;
}

.message.success{
    display:block;
    background:#0c3326;
    border:1px solid #1c8d66;
    color:#72f0c0;
}

.message.error{
    display:block;
    background:#35151a;
    border:1px solid #9e3543;
    color:#ff9da8;
}

.back{
    display:block;
    text-align:center;
    color:#00b7ff;
    text-decoration:none;
    margin-top:20px;
}

.whatsapp-float{
    position:fixed;
    left:20px;
    bottom:92px;
    width:62px;
    height:62px;
    border-radius:50%;
    background:#25D366;
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    box-shadow:0 5px 20px rgba(0,0,0,.25);
    z-index:9999;
}

.whatsapp-float svg{
    width:39px;
    height:39px;
    fill:white;
}

.bottom-nav{
    position:fixed;
    bottom:0;
    right:0;
    left:0;
    height:70px;
    background:#0d111c;
    border-top:1px solid #20283a;
    display:flex;
    align-items:center;
    justify-content:space-around;
    z-index:9998;
}

.bottom-nav a{
    color:#8e9aae;
    text-decoration:none;
    font-size:12px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:5px;
}

.bottom-nav a span{
    font-size:21px;
}

.bottom-nav a.active{
    color:#00b7ff;
}

</style>

</head>

<body>

<header>

<div class="logo">
KATRO SHOP
</div>

<a href="index.html" class="home-btn">
⌂
</a>

</header>


<div class="container">

<div class="card">

<div class="title">
تحويل الرصيد
</div>

<div class="subtitle">
حوّل الرصيد مباشرة إلى محفظة مستخدم آخر
</div>


<div class="balance-box">

<div class="balance-label">
رصيدك الحالي
</div>

<div class="balance" id="balance">
جاري التحميل...
</div>

</div>


<div class="form-group">

<label for="recipientWallet">
رقم محفظة المستلم
</label>

<input
type="text"
id="recipientWallet"
placeholder="أدخل رقم المحفظة"
autocomplete="off">

</div>


<div class="form-group">

<label for="amount">
المبلغ
</label>

<input
type="number"
id="amount"
placeholder="أدخل المبلغ"
min="1"
step="1">

</div>


<div class="form-group">

<label for="note">
ملاحظة اختيارية
</label>

<textarea
id="note"
placeholder="اكتب ملاحظة إذا أردت"></textarea>

</div>


<button
class="send-btn"
id="sendBtn"
onclick="transferMoney()">

تحويل الرصيد

</button>

class="message"
id="message">
</div>


<a
href="wallet.html"
class="back">

العودة إلى المحفظة

</a>

</div>

</div>


<a
class="whatsapp-float"

target="_blank"
rel="noopener"
aria-label="واتساب">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://uwmrzvsygeoequscpinx.supabase.co";

const SUPABASE_KEY =
"sb_publishable_26b3KZpWkLqltiLTyTSpIg_gTgexDts";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


let currentUser = null;
let currentBalance = 0;


function showMessage(text,type){

    const message =
        document.getElementById("message");

    message.textContent = text;

    message.className =
        "message " + type;

}


async function loadUser(){

    const {
        data,
        error
    } =
    await supabaseClient
        .auth
        .getUser();

    if(error || !data.user){

        showMessage(
            "يجب تسجيل الدخول أولاً.",
            "error"
        );

        document.getElementById("sendBtn")
            .disabled = true;

        return false;
    }

    currentUser = data.user;

    return true;
}


async function loadBalance(){

    const balanceElement =
        document.getElementById("balance");


    const {
        data,
        error
    } =
    await supabaseClient
        .from("wallets")
        .select("balance")
        .eq("user_id",currentUser.id)
        .limit(1);


    if(error){

        console.error(error);

        balanceElement.textContent =
            "تعذر تحميل الرصيد";

        return;
    }


    if(!data || data.length === 0){

        currentBalance = 0;

        balanceElement.textContent =
            "0 ج.س";

        return;
    }


    currentBalance =
        Number(data[0].balance || 0);


    balanceElement.textContent =
        currentBalance.toLocaleString("ar-EG")
        + " ج.س";

}


async function transferMoney(){

    const button =
        document.getElementById("sendBtn");

    const recipientWallet =
        document
        .getElementById("recipientWallet")
        .value
        .trim();

    const amountInput =
        document
        .getElementById("amount")
        .value;

    const note =
        document
        .getElementById("note")
        .value
        .trim();


    showMessage("","");


    if(!recipientWallet){

        showMessage(
            "أدخل رقم محفظة المستلم.",
            "error"
        );

        return;
    }


    const amount =
        Number(amountInput);


    if(!Number.isFinite(amount) || amount <= 0){

        showMessage(
            "أدخل مبلغاً صحيحاً.",
            "error"
        );

        return;
    }


    if(amount > currentBalance){

        showMessage(
            "رصيدك غير كافٍ لإجراء التحويل.",
            "error"
        );

        return;
    }


    button.disabled = true;

    button.textContent =
        "جاري تنفيذ التحويل...";


    try{

        const {
            data,
            error
        } =
        await supabaseClient.rpc(
            "transfer_wallet_balance",
            {
                p_recipient_wallet_number:
                    recipientWallet,

                p_amount:
                    amount,

                p_note:
                    note || null
            }
        );


        if(error){

            console.error(
                "Transfer Error:",
                error
            );

            showMessage(
                error.message ||
                "حدث خطأ أثناء التحويل.",
                "error"
            );

            return;
        }


        console.log(
            "Transfer Result:",
            data
        );


        showMessage(
            "تم تحويل " +
            amount.toLocaleString("ar-EG") +
            " ج.س بنجاح إلى المحفظة " +
            recipientWallet,
            "success"
        );


        document
            .getElementById("recipientWallet")
            .value = "";


        document
            .getElementById("amount")
            .value = "";


        document
            .getElementById("note")
            .value = "";


        await loadBalance();


    }catch(error){

        console.error(error);

        showMessage(
            "حدث خطأ غير متوقع أثناء التحويل.",
            "error"
        );

    }finally{

        button.disabled = false;

        button.textContent =
            "تحويل الرصيد";

    }

}


async function init(){

    const loggedIn =
        await loadUser();


    if(!loggedIn){
        return;
    }


    await loadBalance();

}


init();

</script>

</body>
