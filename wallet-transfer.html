<script>

const SUPABASE_URL =
"https://uwmrzvsygeoequscpinx.supabase.co";

const SUPABASE_KEY =
"sb_publishable_26b3KZpWkLqltiLTyTSpIg_gTgexDts";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

let currentUser = null;
let currentBalance = 0;


async function init(){

    const {
        data:{
            user
        }
    } =
    await supabaseClient.auth.getUser();

    if(!user){

        location.href =
        "login.html";

        return;
    }

    currentUser = user;

    await loadBalance();

}


async function loadBalance(){

    const {
        data,
        error
    } =
    await supabaseClient
    .from("wallets")
    .select("balance")
    .eq(
        "user_id",
        currentUser.id
    )
    .limit(1);

    if(error){

        document.getElementById(
            "balance"
        ).textContent =
        "تعذر تحميل الرصيد";

        return;
    }

    currentBalance =
    Number(
        data?.[0]?.balance || 0
    );

    document.getElementById(
        "balance"
    ).textContent =
    currentBalance.toLocaleString("ar-EG")
    + " ج.س";

}


async function transferBalance(){

    const recipient =
    document.getElementById(
        "recipientWallet"
    ).value.trim();

    const amount =
    Number(
        document.getElementById(
            "amount"
        ).value
    );

    const note =
    document.getElementById(
        "note"
    ).value.trim();

    const button =
    document.getElementById(
        "transferBtn"
    );


    if(!recipient){

        showMessage(
            "أدخل رقم محفظة المستلم",
            false
        );

        return;
    }


    if(!amount || amount <= 0){

        showMessage(
            "أدخل مبلغاً صحيحاً",
            false
        );

        return;
    }


    if(amount > currentBalance){

        showMessage(
            "رصيدك غير كافٍ",
            false
        );

        return;
    }


    button.disabled = true;

    button.textContent =
    "جاري التحويل...";


    const {
        data,
        error
    } =
    await supabaseClient.rpc(
        "transfer_wallet_balance",
        {
            p_recipient_wallet_number:
            recipient,

            p_amount:
            amount,

            p_note:
            note || null
        }
    );


    button.disabled = false;

    button.textContent =
    "تحويل الرصيد";


    if(error){

        console.error(error);

        showMessage(
            error.message ||
            "تعذر تنفيذ التحويل",
            false
        );

        return;
    }


    if(data?.success){

        showMessage(
            "تم التحويل بنجاح إلى المحفظة " +
            data.recipient_wallet,
            true
        );


        currentBalance =
        Number(data.new_balance);


        document.getElementById(
            "balance"
        ).textContent =
        currentBalance.toLocaleString("ar-EG")
        + " ج.س";


        document.getElementById(
            "recipientWallet"
        ).value = "";

        document.getElementById(
            "amount"
        ).value = "";

        document.getElementById(
            "note"
        ).value = "";

    }

}


function showMessage(text,success){

    const box =
    document.getElementById(
        "message"
    );

    box.className =
    "message " +
    (
        success
        ? "success"
        : "error"
    );

    box.textContent =
    text;

}


init();

</script>
