<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KATRO SHOP</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@700;800&display=swap');
*{font-family:'Tajawal',sans-serif;box-sizing:border-box;margin:0;padding:0}
body{background:#f4f0ff}
.header{background:#673bff;height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;color:#fff;position:sticky;top:0;z-index:10}
.header .circle{width:38px;height:38px;background:#4c24c4;border-radius:50%;display:flex;align-items:center;justify-content:center}
.search{display:flex;margin:12px;background:#fff;border-radius:14px;overflow:hidden;border:1px solid #e8e0ff;height:46px}
.search input{flex:1;border:none;outline:none;padding:0 14px}
.search button{background:#ff8c00;border:none;color:#fff;width:56px;font-size:18px}
.banner{margin:12px;background:linear-gradient(105deg,#ffe600 0% 55%,#673bff 55% 100%);border-radius:18px;height:96px;display:flex;align-items:center;padding:0 16px}
.banner .white{background:#fff;border-radius:14px;padding:10px 14px}
.banner .white b{font-size:14px}
.banner .white span{font-size:11px;color:#666}
.title{text-align:center;margin:20px 0 10px;color:#673bff;font-weight:800;font-size:13px}
.title span{border-top:2px dashed #b9a8ff;border-bottom:2px dashed #b9a8ff;padding:6px 20px;border-radius:2px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 12px}
.card{background:#fff;border-radius:20px;text-align:center;padding-top:18px;position:relative;box-shadow:0 4px 14px rgba(0,0,0,.06);text-decoration:none;color:#000;padding-bottom:10px}
.card:before{content:'';position:absolute;top:9px;left:50%;transform:translateX(-50%);width:28px;height:10px;background:#e9e3ff;border-radius:20px}
.card img{width:84%;aspect-ratio:1;border-radius:14px;background:#f5f5f5;object-fit:cover}
.card h3{font-size:13px;margin-top:6px}
.card p{font-size:11px;color:#673bff;margin-top:2px;font-weight:700}
.bottom{position:fixed;bottom:12px;left:12px;right:12px;height:64px;background:#19142e;border-radius:32px;display:flex;justify-content:space-around;align-items:center;z-index:20}
.bottom a{color:#8b8ba0;text-decoration:none;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:3px}
.bottom a.active{color:#bda7ff}
</style>
</head>
<body>

<div style="font-weight:800;letter-spacing:1px">KATRO SHOP</div>

</div>

<div class="search">

<button>🔍</button>
</div>

<div class="banner">
<div class="white"><b>شحن فوري بضغطة زر</b><br><span>ادخل ID والباقي علينا</span></div>
<div style="font-size:40px">🎮</div>
</div>

<div class="title"><span>〰️ شحن الألعاب 〰️</span></div>
<div class="grid">
<a class="card" href="game.html?g=freefire"><img src="https://i.imgur.com/8Qf5a4A.png"><h3>Free Fire</h3><p>فري فاير</p></a>
<a class="card" href="game.html?g=pubg"><img src="https://i.imgur.com/1n3wK3t.png"><h3>PUBG UC</h3><p>ببجي</p></a>
<a class="card" href="game.html?g=tiktok"><img src="https://i.imgur.com/L3a1Q1T.png"><h3>TikTok</h3><p>عملات تيك توك</p></a>
<a class="card" href="game.html?g=delta"><img src="https://i.imgur.com/2y5o1xQ.png"><h3>Delta Force</h3><p>دلتا فورس</p></a>
<a class="card" href="game.html?g=efootball"><img src="https://i.imgur.com/QpE8k5b.png"><h3>eFootball</h3><p>اي فوتبول</p></a>
<a class="card" href="game.html?g=jawaker"><img src="https://i.imgur.com/8Km9tLL.png"><h3>Jawaker</h3><p>جواكر</p></a>
</div>

<div class="title"><span>〰️ بطاقات المتجر 〰️</span></div>
<div class="grid" style="padding-bottom:90px">
<a class="card" href="game.html?g=googleplay"><img src="https://i.imgur.com/6s5s2cO.png"><h3>Google Play</h3><p>قوقل بلاي</p></a>
<a class="card" href="game.html?g=visa"><img src="https://i.imgur.com/8yK9b6a.png"><h3>VISA</h3><p>فيزا</p></a>

<div class="bottom">

<a class="active" href="index.html"><div style="font-size:18px">🏠</div>الرئيسية</a>
</div>

</body>
  </html>
