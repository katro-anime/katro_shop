<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>KATRO SHOP</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Tahoma,Arial,sans-serif;
    background:#f5f7fa;
    color:#222;
    min-height:100vh;
    padding-bottom:85px;
}

/* ================= HEADER ================= */

header{
    background:linear-gradient(135deg,#111827,#2563eb);
    color:white;
    padding:22px 18px 25px;
    border-radius:0 0 25px 25px;
    box-shadow:0 4px 15px rgba(0,0,0,.12);
}

.header-content{
    max-width:1100px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.logo{
    font-size:25px;
    font-weight:bold;
    letter-spacing:1px;
}

.logo span{
    color:#60a5fa;
}

.login-btn{
    text-decoration:none;
    color:white;
    background:rgba(255,255,255,.15);
    padding:10px 16px;
    border-radius:12px;
    font-size:14px;
    border:1px solid rgba(255,255,255,.2);
}

/* ================= SEARCH ================= */

.search-box{
    max-width:1100px;
    margin:18px auto 0;
    position:relative;
}

.search-box input{
    width:100%;
    border:none;
    outline:none;
    background:white;
    padding:15px 18px;
    border-radius:15px;
    font-size:15px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.search-box input:focus{
    box-shadow:0 0 0 2px #2563eb;
}

/* ================= MAIN ================= */

main{
    max-width:1100px;
    margin:auto;
    padding:22px 15px 90px;
}

/* ================= BANNER ================= */

.banner{
    background:linear-gradient(135deg,#2563eb,#1d4ed8);
    color:white;
    padding:22px;
    border-radius:20px;
    margin-bottom:25px;
    box-shadow:0 5px 15px rgba(37,99,235,.2);
}

.banner h1{
    font-size:23px;
    margin-bottom:8px;
}

.banner p{
    font-size:14px;
    opacity:.92;
    line-height:1.8;
}

/* ================= SECTION ================= */

.section-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.section-title h2{
    font-size:20px;
}

.section-title span{
    color:#777;
    font-size:13px;
}

/* ================= SERVICES ================= */

.services-grid{
    display:grid;
    grid-template-columns:repeat(
        auto-fill,
        minmax(145px,1fr)
    );
    gap:14px;
}

/* ================= CARD ================= */

.service-card{
    background:white;
    border-radius:18px;
    padding:15px;
    min-height:175px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    cursor:pointer;
    border:1px solid #e5e7eb;
    box-shadow:0 3px 12px rgba(0,0,0,.06);
    transition:.2s;
}

.service-card:hover{
    transform:translateY(-4px);
    box-shadow:0 7px 20px rgba(0,0,0,.12);
}

.service-card:active{
    transform:scale(.97);
}

/* ================= IMAGE ================= */

.service-image{
    width:85px;
    height:85px;
    border-radius:18px;
    object-fit:cover;
    display:block;
    margin-bottom:12px;
    border:1px solid #e5e7eb;
}

/* ================= EMOJI ================= */

.service-emoji{
    width:85px;
    height:85px;
    border-radius:18px;
    background:#f1f5f9;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:42px;
    margin-bottom:12px;
}

.service-card h3{
    font-size:15px;
    margin-bottom:6px;
    color:#111827;
}

.service-card p{
    font-size:12px;
    color:#777;
}

/* ================= LOADING ================= */

.loading{
    background:white;
    border-radius:18px;
    padding:35px;
    text-align:center;
    color:#777;
    grid-column:1 / -1;
}

/* ================= ERROR ================= */

.error{
    background:#fff1f2;
    color:#be123c;
    padding:20px;
    border-radius:15px;
    text-align:center;
    grid-column:1 / -1;
    line-height:1.8;
}

.debug-info{
    margin-top:8px;
    font-size:12px;
    color:#777;
    direction:ltr;
    word-break:break-word;
}

/* ================= EMPTY ================= */

.empty{
    background:white;
    padding:30px;
    border-radius:18px;
    text-align:center;
    color:#777;
    grid-column:1 / -1;
}

/* ================= WHATSAPP ================= */

.whatsapp-float{
    position:fixed;

    left:18px;
    bottom:82px;

    width:60px;
    height:60px;

    border-radius:50%;

    background:#25D366;

    display:flex;
    align-items:center;
    justify-content:center;

    text-decoration:none;

    z-index:9999;

    box-shadow:
        0 5px 18px rgba(0,0,0,.25);

    transition:.2s;
}

.whatsapp-float:hover{
    transform:scale(1.08);
}

.whatsapp-icon{
    width:37px;
    height:37px;
}

/* ================= WHATSAPP LABEL ================= */

.whatsapp-label{
    position:fixed;

    left:88px;
    bottom:92px;

    background:white;
    color:#555;

    padding:9px 13px;

    border-radius:8px;

    font-size:12px;

    box-shadow:
        0 3px 12px rgba(0,0,0,.12);

    z-index:9998;
}

/* ================= BOTTOM NAV ================= */

.bottom-nav{
    position:fixed;
    bottom:0;
    right:0;
    left:0;

    height:70px;

    background:#0b0718;

    display:flex;
    justify-content:center;

    z-index:9000;

    box-shadow:
        0 -5px 18px rgba(0,0,0,.18);
}

.bottom-nav-inner{
    width:100%;
    max-width:650px;

    display:flex;
    justify-content:space-around;
    align-items:center;
}

.nav-item{
    text-decoration:none;

    color:#aaa;

    font-size:11px;

    display:flex;
    flex-direction:column;

    align-items:center;

    gap:4px;

    padding:6px 12px;

    min-width:70px;
}

.nav-item .icon{
    font-size:22px;
}

.nav-item.active{
    color:#2563eb;
    font-weight:bold;
}

/* ================= MOBILE ================= */

@media(max-width:600px){

    header{
        padding:18px 14px 22px;
    }

    .logo{
        font-size:22px;
    }

    .login-btn{
        padding:8px 12px;
        font-size:13px;
    }

    main{
        padding:18px 12px 95px;
    }

    .banner h1{
        font-size:20px;
    }

    .services-grid{
        grid-template-columns:repeat(2,1fr);
        gap:11px;
    }

    .service-card{
        min-height:165px;
        padding:12px;
    }

    .service-image,
    .service-emoji{
        width:75px;
        height:75px;
    }

    .service-emoji{
        font-size:36px;
    }

    .whatsapp-float{
        left:15px;
        bottom:82px;

        width:58px;
        height:58px;
    }

    .whatsapp-icon{
        width:35px;
        height:35px;
    }

    .whatsapp-label{
        left:82px;
        bottom:91px;
    }

}

@media(max-width:350px){

    .services-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .service-card h3{
        font-size:13px;
    }

}

</style>

</head>

<!-- ================= SUPABASE ================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>


/* ================= SUPABASE ================= */

const SUPABASE_URL =
"https://uwmrzvsygeoequscpinx.supabase.co";

const SUPABASE_KEY =
"sb_publishable_26b3KZpWkLqltiLTyTSpIg_gTgexDts";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* ================= ELEMENTS ================= */

const servicesBox =
document.getElementById("services");

const searchInput =
document.getElementById("searchInput");

const servicesCount =
document.getElementById("servicesCount");


/* ================= SERVICE NAMES ================= */

const serviceNames = {

    freefire:"Free Fire",

    pubg:"PUBG Mobile",

    codm:"Call of Duty Mobile",

    efootball:"eFootball",

    jawaker:"جواكر",

    mobilelegends:"Mobile Legends",

    yallaludo:"Yalla Ludo",

    tiktok:"TikTok",

    googleplay:"Google Play",

    itunes:"iTunes",

    playstation:"PlayStation",

    xbox:"Xbox",

    razergold:"Razer Gold",

    netflix:"Netflix",

    visa:"Visa",

    mastercard:"Mastercard",

    zain:"زين",

    mtn:"MTN",

    sudani:"سوداني",

    cashi:"Cashi",

    starlink:"Starlink",

    katro:"KATRO",

    katrocard:"KATRO Card",

    pyypl:"Pyypl"

};


/* ================= SERVICE ICONS ================= */

const serviceIcons = {

    freefire:"🔥",

    pubg:"🎮",

    codm:"🎯",

    efootball:"⚽",

    jawaker:"🃏",

    mobilelegends:"⚔️",

    yallaludo:"🎲",

    tiktok:"🎵",

    googleplay:"▶️",

    itunes:"🎵",

    playstation:"🎮",

    xbox:"🎮",

    razergold:"🟡",

    netflix:"🎬",

    visa:"💳",

    mastercard:"💳",

    zain:"📱",

    mtn:"📱",

    sudani:"📱",

    cashi:"💰",

    starlink:"🌐",

    katro:"🛒",

    katrocard:"💳",

    pyypl:"💳"

};


/* ================= SERVICE IMAGES ================= */

const serviceImages = {

    freefire:"freefire.jpg",

    pubg:"pubg.jpg",

    codm:"collofduty.jpg",

    efootball:"efootball.jpg",

    tiktok:"tiktok.jpg",

    netflix:"netflix.jpg",

    xbox:"xbox.jpg"

};


/* ================= ESCAPE HTML ================= */

function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* ================= ALL SERVICES ================= */

let allServices = [];


/* ================= LOAD SERVICES ================= */

async function loadServices(){

    servicesBox.innerHTML = `

        <div class="loading">
            جاري تحميل الخدمات...
        </div>

    `;

    try{

        const {
            data,
            error
        } =
        await supabaseClient
        .from("products")
        .select("game_key,active")
        .eq("active",true);


        if(error){

            console.error(
                "Supabase Error:",
                error
            );

            servicesBox.innerHTML = `

                <div class="error">

                    حدث خطأ أثناء تحميل الخدمات.

                    <div class="debug-info">

                        ${escapeHtml(
                            error.message ||
                            "خطأ غير معروف"
                        )}

                    </div>

                </div>

            `;

            servicesCount.textContent =
                "خطأ";

            return;

        }


        if(!data || data.length === 0){

            servicesBox.innerHTML = `

                <div class="empty">
                    لا توجد خدمات متاحة حالياً.
                </div>

            `;

            servicesCount.textContent =
                "0 خدمة";

            return;

        }


        const serviceMap = {};


        data.forEach(product => {

            const key =
                String(
                    product.game_key || ""
                )
                .trim()
                .toLowerCase();


            if(!key){
                return;
            }


            if(!serviceMap[key]){

                serviceMap[key] = {

                    key:key,

                    count:0

                };

            }


            serviceMap[key].count++;

        });


        allServices =
            Object.values(serviceMap);


        allServices.sort(
            (a,b) =>
            a.key.localeCompare(b.key)
        );


        renderServices(
            allServices
        );

    }

    catch(error){

        console.error(error);

        servicesBox.innerHTML = `

            <div class="error">

                حدث خطأ أثناء الاتصال بالخادم.

                <div class="debug-info">

                    ${escapeHtml(
                        error.message ||
                        "خطأ غير معروف"
                    )}

                </div>

            </div>

        `;

        servicesCount.textContent =
            "خطأ";

    }

}


/* ================= RENDER SERVICES ================= */

function renderServices(
    services
){

    if(
        !services ||
        services.length === 0
    ){

        servicesBox.innerHTML = `

            <div class="empty">
                لا توجد نتائج.
            </div>

        `;

        servicesCount.textContent =
            "0 خدمة";

        return;

    }


    servicesCount.textContent =
        services.length + " خدمة";


    servicesBox.innerHTML =
        services.map(
            service => {

                const name =
                    serviceNames[
                        service.key
                    ] ||
                    service.key;


                const icon =
                    serviceIcons[
                        service.key
                    ] ||
                    "🛍️";


                const image =
                    serviceImages[
                        service.key
                    ];


                let visual;


                if(image){

                    visual = `

                        <img
                            class="service-image"
                            src="${escapeHtml(image)}"
                            alt="${escapeHtml(name)}"

                            onerror="
                                this.style.display='none';
                                this.nextElementSibling.style.display='flex';
                            "
                        >

                        <span
                            class="service-emoji"
                            style="display:none;"
                        >
                            ${icon}
                        </span>

                    `;

                }

                else{

                    visual = `

                        <span
                            class="service-emoji"
                        >
                            ${icon}
                        </span>

                    `;

                }


                return `

                    <div
                        class="service-card"
                        onclick="
                            openService(
                                '${escapeHtml(service.key)}'
                            )
                        "
                    >

                        ${visual}

                        <h3>
                            ${escapeHtml(name)}
                        </h3>

                        <p>

                            ${service.count}

                            ${
                                service.count === 1
                                ? "خدمة"
                                : "خدمات"
                            }

                        </p>

                    </div>

                `;

            }
        )
        .join("");

}


/* ================= OPEN SERVICE ================= */

function openService(
    gameKey
){

    if(!gameKey){
        return;
    }


    window.location.href =
        "game.html?g=" +
        encodeURIComponent(
            gameKey
        );

}


/* ================= SEARCH ================= */

searchInput.addEventListener(
    "input",
    function(){

        const search =
            this.value
                .trim()
                .toLowerCase();


        if(!search){

            renderServices(
                allServices
            );

            return;

        }


        const filtered =
            allServices.filter(
                service => {

                    const name =
                        (
                            serviceNames[
                                service.key
                            ] ||
                            service.key
                        )
                        .toLowerCase();


                    return (

                        name.includes(
                            search
                        )

                        ||

                        service.key.includes(
                            search
                        )

                    );

                }
            );


        renderServices(
            filtered
        );

    }
);


/* ================= START ================= */

loadServices();

</script>
