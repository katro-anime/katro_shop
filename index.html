<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Tahoma,sans-serif;
    background:#f5f5fb;
    color:#222;
    min-height:100vh;
}

/* =========================
   HEADER
========================= */

header{
    background:linear-gradient(135deg,#5b22ff,#7a2cff);
    color:#fff;
    padding:15px;
    position:sticky;
    top:0;
    z-index:100;
    box-shadow:0 3px 12px rgba(0,0,0,.15);
}

.header-top{
    max-width:1100px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    font-size:23px;
    font-weight:bold;
}

.header-icon{
    font-size:25px;
}

/* SEARCH */

.search-box{
    max-width:1100px;
    margin:14px auto 0;
    position:relative;
}

.search-box input{
    width:100%;
    border:none;
    outline:none;
    padding:13px 45px 13px 15px;
    border-radius:12px;
    font-size:15px;
}

.search-icon{
    position:absolute;
    right:15px;
    top:10px;
    color:#777;
    font-size:20px;
}

/* =========================
   BANNER
========================= */

.banner{
    max-width:1100px;
    margin:18px auto;
    width:94%;
    border-radius:18px;
    padding:25px 20px;
    background:linear-gradient(135deg,#111827,#222c48);
    color:#fff;
    overflow:hidden;
}

.banner h1{
    font-size:25px;
    margin-bottom:8px;
}

.banner p{
    color:#d4d9e5;
    line-height:1.8;
}

/* =========================
   CONTAINER
========================= */

.container{
    width:94%;
    max-width:1100px;
    margin:auto;
    padding-bottom:90px;
}

.section-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:25px 0 15px;
}

.section-title h2{
    font-size:21px;
}

.section-title span{
    color:#7040ff;
    font-size:13px;
}

/* =========================
   CATEGORIES
========================= */

.categories{
    display:grid;
    grid-template-columns:
        repeat(auto-fill,minmax(150px,1fr));
    gap:14px;
}

.category{
    background:#fff;
    border:1px solid #eee;
    border-radius:16px;
    overflow:hidden;
    cursor:pointer;
    transition:.2s;
    box-shadow:0 2px 10px rgba(0,0,0,.07);
}

.category:hover{
    transform:translateY(-4px);
    box-shadow:0 7px 18px rgba(0,0,0,.13);
    border-color:#7040ff;
}

.category-image{
    height:135px;
    background:#eee;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

.category-image img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.category-icon{
    font-size:48px;
}

.category-info{
    padding:12px;
    text-align:center;
}

.category-info h3{
    font-size:16px;
    margin-bottom:6px;
}

.category-info p{
    color:#888;
    font-size:12px;
}

.category-button{
    margin-top:9px;
    width:100%;
    border:none;
    background:#5b22ff;
    color:#fff;
    padding:9px;
    border-radius:9px;
    font-weight:bold;
    cursor:pointer;
}

/* =========================
   LOADING / ERROR
========================= */

.loading{
    text-align:center;
    padding:45px 10px;
    color:#777;
}

.error{
    background:#ffe4e4;
    color:#b42323;
    padding:15px;
    border-radius:12px;
    text-align:center;
    margin:20px 0;
    display:none;
}

.empty{
    background:#fff;
    border-radius:15px;
    padding:35px;
    text-align:center;
    color:#888;
}

/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:65px;
    background:#fff;
    border-top:1px solid #ddd;
    display:flex;
    justify-content:space-around;
    align-items:center;
    z-index:100;
}

.nav-item{
    text-decoration:none;
    color:#777;
    text-align:center;
    font-size:12px;
}

.nav-item .icon{
    display:block;
    font-size:22px;
    margin-bottom:3px;
}

.nav-item.active{
    color:#5b22ff;
}

/* =========================
   FOOTER
========================= */

footer{
    margin-top:35px;
    margin-bottom:80px;
    background:#111827;
    color:#aaa;
    text-align:center;
    padding:25px 15px;
}

footer strong{
    color:#fff;
}

/* =========================
   MOBILE
========================= */

@media(max-width:500px){

    .categories{
        grid-template-columns:
            repeat(2,1fr);
        gap:10px;
    }

    .category-image{
        height:120px;
    }

    .category-info{
        padding:10px;
    }

    .category-info h3{
        font-size:14px;
    }

    .category-button{
        font-size:12px;
        padding:8px;
    }

    .banner h1{
        font-size:21px;
    }

}

</style>

</head>

<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://uwmrzvsygeoequscpinx.supabase.co";

const SUPABASE_KEY =
"sb_publishable_26b3KzpWkLqltiLTyTSpIg_gTgexDts";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================
   أسماء الأقسام
========================= */

const gameNames = {

    freefire:"Free Fire",
    pubg:"PUBG Mobile",
    codm:"Call of Duty Mobile",
    efootball:"eFootball",
    jawaker:"Jawaker",
    mobilelegends:"Mobile Legends",
    yallaludo:"Yalla Ludo",
    tiktok:"TikTok",
    googleplay:"Google Play",
    itunes:"iTunes",
    playstation:"PlayStation",
    xbox:"Xbox",
    razergold:"Razer Gold",
    netflix:"Netflix",
    visa:"Visa",
    mastercard:"Mastercard",
    zain:"Zain",
    mtn:"MTN",
    sudani:"Sudani",
    cashi:"Cashi",
    starlink:"Starlink",
    katro:"KATRO CARD",
    katrocard:"KATRO CARD",
    pyypl:"Pyypl"

};


/* =========================
   أيقونات الأقسام
========================= */

const gameIcons = {

    freefire:"🔥",
    pubg:"🎯",
    codm:"🎮",
    efootball:"⚽",
    jawaker:"🃏",
    mobilelegends:"⚔️",
    yallaludo:"🎲",
    tiktok:"🎵",
    googleplay:"▶️",
    itunes:"🎵",
    playstation:"🎮",
    xbox:"🎮",
    razergold:"🟢",
    netflix:"🎬",
    visa:"💳",
    mastercard:"💳",
    zain:"📱",
    mtn:"📱",
    sudani:"📱",
    cashi:"💰",
    starlink:"🛰️",
    katro:"💳",
    katrocard:"💳",
    pyypl:"💳"

};


let allProducts = [];

let categories = [];


/* =========================
   تحميل المنتجات
========================= */

async function loadProducts(){

    const container =
        document.getElementById(
            "categoriesContainer"
        );


    container.innerHTML = `
        <div class="loading">
            جاري تحميل الأقسام...
        </div>
    `;


    const {
        data,
        error
    } =
    await supabaseClient
        .from("products")
        .select(`
            id,
            game_key,
            name,
            description,
            price,
            image_url,
            active
        `)
        .eq("active",true)
        .order("id",{
            ascending:true
        });


    if(error){

        console.error(
            "Products Error:",
            error
        );


        const errorBox =
            document.getElementById(
                "errorBox"
            );


        errorBox.textContent =
            "حدث خطأ أثناء تحميل الخدمات.";


        errorBox.style.display =
            "block";


        container.innerHTML = `
            <div class="empty">
                تعذر تحميل الخدمات حالياً.
            </div>
        `;

        return;

    }


    allProducts =
        data || [];


    buildCategories();

}


/* =========================
   إنشاء الأقسام
========================= */

function buildCategories(){

    const map = {};


    allProducts.forEach(product => {

        const key =
            String(
                product.game_key || ""
            )
            .trim()
            .toLowerCase();


        if(!key){
            return;
        }


        if(!map[key]){

            map[key] = {

                game_key:key,

                name:
                    gameNames[key]
                    ||
                    key,

                image_url:
                    product.image_url
                    ||
                    "",

                count:1

            };

        }else{

            map[key].count++;

            if(
                !map[key].image_url &&
                product.image_url
            ){

                map[key].image_url =
                    product.image_url;

            }

        }

    });


    categories =
        Object.values(map);


    document.getElementById(
        "categoryCount"
    ).textContent =
        categories.length +
        " قسم";


    renderCategories(
        categories
    );

}


/* =========================
   عرض الأقسام
========================= */

function renderCategories(list){

    const container =
        document.getElementById(
            "categoriesContainer"
        );


    if(!list.length){

        container.innerHTML = `
            <div class="empty">
                لا توجد خدمات متاحة حالياً.
            </div>
        `;

        return;

    }


    container.innerHTML = `

        <div class="categories">

            ${list.map(category => {

                const key =
                    category.game_key;


                const image =
                    category.image_url;


                const imageHTML =
                    image
                    ?

                    `
                    <img
                        src="${escapeHtml(image)}"
                        alt="${escapeHtml(category.name)}"
                        loading="lazy"
                        onerror="
                            this.style.display='none';
                            this.parentElement
                                .querySelector('.category-icon')
                                .style.display='block';
                        ">
                    `

                    :

                    "";


                const icon =
                    gameIcons[key]
                    ||
                    "🎮";


                return `

                    <div
                        class="category"
                        onclick="openCategory('${escapeJs(key)}')">

                        <div class="category-image">

                            ${imageHTML}

                            <span
                                class="category-icon"
                                style="
                                    ${image
                                        ? "display:none;"
                                        : "display:block;"
                                    }
                                ">

                                ${icon}

                            </span>

                        </div>


                        <div class="category-info">

                            <h3>
                                ${escapeHtml(
                                    category.name
                                )}
                            </h3>


                            <p>
                                ${category.count}
                                خدمة متاحة
                            </p>


                            <button
                                class="category-button"
                                type="button">

                                عرض الخدمات

                            </button>

                        </div>

                    </div>

                `;

            }).join("")}

        </div>

    `;

}


/* =========================
   فتح القسم
========================= */

function openCategory(gameKey){

    if(!gameKey){
        return;
    }


    /*
       شحن الهاتف له صفحة مستقلة
    */

    if(
        gameKey === "zain" ||
        gameKey === "mtn" ||
        gameKey === "sudani"
    ){

        window.location.href =
            "mobile-topup.html?network=" +
            encodeURIComponent(gameKey);

        return;

    }


    window.location.href =
        "game.html?g=" +
        encodeURIComponent(gameKey);

}


/* =========================
   البحث عن الأقسام
========================= */

document.getElementById(
    "searchInput"
).addEventListener(
    "input",
    function(){

        const search =
            this.value
                .trim()
                .toLowerCase();


        if(!search){

            renderCategories(
                categories
            );

            return;

        }


        const filtered =
            categories.filter(
                category => {

                    const name =
                        String(
                            category.name || ""
                        )
                        .toLowerCase();


                    const key =
                        String(
                            category.game_key || ""
                        )
                        .toLowerCase();


                    return (
                        name.includes(search)
                        ||
                        key.includes(search)
                    );

                }
            );


        renderCategories(
            filtered
        );

    }
);


/* =========================
   حماية النص
========================= */

function escapeHtml(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }


    return String(value)

        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function escapeJs(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }


    return String(value)

        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'")
        .replace(/\r/g,"\\r")
        .replace(/\n/g,"\\n");

}


/* =========================
   التشغيل
========================= */

document.addEventListener(
    "DOMContentLoaded",
    loadProducts
);

</script>
