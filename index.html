*{

    padding:0;
}

body{

/* HEADER */

header{
    background:linear-gradient(135deg,#6a11cb,#2575fc);

    max-width:1100px;

.logo{

}

.header-btn{

.search-box{

    position:relative;
}

.search-box input{
    width:100%;
    padding:14px 18px;
    border:none;
    border-radius:13px;
    outline:none;
    font-size:15px;
    box-shadow:0 3px 10px rgba(0,0,0,.12);
}

/* BANNER */

.banner{
    max-width:1100px;
    margin:18px auto;
    background:white;
    border-radius:16px;
    padding:20px;
    box-shadow:0 3px 12px rgba(0,0,0,.07);
}

    margin-bottom:8px;
}

.banner p{
    color:#666;

/* SECTION */

.section-title{
    max-width:1100px;
    margin:25px auto 14px;
    padding:0 12px;
    display:flex;

    align-items:center;
}

.section-title h2{
    font-size:20px;
}

.section-title span{
    color:#777;
    font-size:13px;
}

/* SERVICES */

.services{
    max-width:1100px;
    margin:auto;
    padding:0 12px 100px;

    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
    gap:15px;
}

.service-card{
    background:white;
    border-radius:16px;
    padding:18px 14px;
    min-height:155px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    cursor:pointer;

    box-shadow:0 3px 12px rgba(0,0,0,.07);

    transition:.2s;
    border:1px solid #eee;
}

.service-card:hover{
    transform:translateY(-4px);
    box-shadow:0 7px 20px rgba(0,0,0,.12);
}

.service-icon{
    width:75px;
    height:75px;
    border-radius:18px;

    background:#f0f2ff;

    display:flex;
    align-items:center;
    justify-content:center;

    margin-bottom:12px;

    overflow:hidden;
}

.service-icon img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.service-emoji{
    font-size:40px;
}

.service-name{
    font-size:17px;
    font-weight:bold;
    text-align:center;
    margin-bottom:6px;
}

.service-count{
    font-size:12px;
    color:#888;
}

/* LOADING */

.loading{
    max-width:1100px;
    margin:30px auto;
    padding:30px;
    text-align:center;
    color:#777;
}

/* ERROR */

.error-box{
    max-width:900px;
    margin:25px auto;
    background:#fff0f0;
    border:1px solid #ffbcbc;
    color:#b00020;
    border-radius:14px;
    padding:18px;
    line-height:1.8;
    direction:rtl;
}

.error-title{
    font-weight:bold;
    margin-bottom:8px;
}

/* EMPTY */

.empty{
    max-width:700px;
    margin:30px auto;
    background:white;
    padding:30px;
    text-align:center;
    border-radius:15px;
    color:#777;
}

/* BOTTOM NAV */

.bottom-nav{
    position:fixed;
    bottom:0;
    right:0;
    left:0;

    height:65px;

    background:white;

    display:flex;
    justify-content:center;
    gap:5px;

    border-top:1px solid #ddd;

    box-shadow:0 -3px 12px rgba(0,0,0,.08);

    z-index:1000;
}

.nav-item{
    flex:1;
    max-width:180px;

    text-decoration:none;
    color:#666;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    font-size:12px;
}

.nav-icon{
    font-size:21px;
    margin-bottom:3px;
}

.nav-item.active{
    color:#2575fc;
    font-weight:bold;
}

/* MOBILE */

@media(max-width:600px){

    header{
        padding:15px 12px 18px;
    }

    .logo{
        font-size:21px;
    }

    .header-btn{
        padding:8px 10px;
        font-size:12px;
    }

    .banner{
        margin:12px;
        padding:17px;
    }

    .banner h1{
        font-size:20px;
    }

    .services{
        grid-template-columns:repeat(2,1fr);
        gap:10px;
    }

    .service-card{
        min-height:145px;
        padding:14px 8px;
    }

    .service-icon{
        width:65px;
        height:65px;
    }

    .service-name{
        font-size:15px;
    }

}

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://uwmrzvsygeoequscpinx.supabase.co";

const SUPABASE_KEY =
"sb_publishable_26b3KzpWkLqltiLTyTSpIg_gTgexDts";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================
   SERVICE NAMES
========================= */

const gameNames = {

    freefire:"Free Fire",

    pubg:"PUBG Mobile",

    codm:"Call of Duty Mobile",

    efootball:"eFootball",

    jawaker:"Jawaker",

    mobilelegends:"Mobile Legends",

    yallaludo:"Yalla Ludo",

    tiktok:"TikTok",

    googleplay:"Google Play",

    itunes:"iTunes",

    playstation:"PlayStation",

    xbox:"Xbox",

    razergold:"Razer Gold",

    netflix:"Netflix",

    visa:"Visa",

    mastercard:"MasterCard",

    zain:"Zain",

    mtn:"MTN",

    sudani:"Sudani",

    cashi:"Cashi",

    starlink:"Starlink",

    katro:"KATRO",

    katrocard:"KATRO Card",

    pyypl:"Pyypl"

};


/* =========================
   SERVICE ICONS
========================= */

const serviceIcons = {

    freefire:"🔥",

    pubg:"🎮",

    codm:"🔫",

    efootball:"⚽",

    jawaker:"🃏",

    mobilelegends:"⚔️",

    yallaludo:"🎲",

    tiktok:"🎵",

    googleplay:"▶️",

    itunes:"🎵",

    playstation:"🎮",

    xbox:"🎮",

    razergold:"💳",

    netflix:"🎬",

    visa:"💳",

    mastercard:"💳",

    zain:"📱",

    mtn:"📱",

    sudani:"📱",

    cashi:"💰",

    starlink:"🛰️",

    katro:"🛒",

    katrocard:"💳",

    pyypl:"💳"

};


/* =========================
   DATA
========================= */

let allServices = [];


/* =========================
   LOAD SERVICES
========================= */

async function loadServices(){

    const container =
        document.getElementById("servicesContainer");

    const loading =
        document.getElementById("loading");

    const errorContainer =
        document.getElementById("errorContainer");

    const serviceCount =
        document.getElementById("serviceCount");


    container.innerHTML = "";

    errorContainer.innerHTML = "";

    loading.style.display = "block";


    try{

        /*
         * نطلب game_key و active فقط
         * حتى تكون العملية أخف وأكثر توافقاً.
         */

        const { data, error } =
            await supabaseClient
                .from("products")
                .select("game_key,active")
                .eq("active",true);


        if(error){

            console.error(
                "Supabase Error:",
                error
            );

            loading.style.display = "none";

            serviceCount.textContent =
                "خطأ";

            errorContainer.innerHTML = `

                <div class="error-box">

                    <div class="error-title">
                        حدث خطأ أثناء تحميل الخدمات
                    </div>

                    <div>
                        ${escapeHtml(
                            error.message ||
                            "تعذر الاتصال بقاعدة البيانات"
                        )}
                    </div>

                    <div style="margin-top:8px;font-size:13px;">
                        إذا ظهر هذا الخطأ مرة أخرى،
                        أرسل لي صورة الخطأ أو نصه وسأصلحه لك.
                    </div>

                </div>

            `;

            return;
        }


        /*
         * تجميع المنتجات حسب game_key
         */

        const grouped = {};


        (data || []).forEach(product => {

            if(!product.game_key){
                return;
            }

            const key =
                String(product.game_key)
                .trim()
                .toLowerCase();


            if(!grouped[key]){
                grouped[key] = 0;
            }

            grouped[key]++;

        });


        /*
         * تحويل الخدمات إلى مصفوفة
         */

        allServices =
            Object.keys(grouped)
            .map(key => ({

                key:key,

                name:
                    gameNames[key] ||
                    formatGameName(key),

                count:
                    grouped[key],

                icon:
                    serviceIcons[key] ||
                    "🛍️"

            }))
            .sort((a,b) =>
                a.name.localeCompare(
                    b.name,
                    "ar"
                )
            );


        loading.style.display = "none";


        serviceCount.textContent =
            allServices.length +
            " خدمة";


        if(allServices.length === 0){

            container.innerHTML = `

                <div class="empty">

                    لا توجد خدمات متاحة حالياً.

                </div>

            `;

            return;
        }


        renderServices(allServices);

    }

    catch(err){

        console.error(err);

        loading.style.display = "none";

        serviceCount.textContent =
            "خطأ";

        errorContainer.innerHTML = `

            <div class="error-box">

                <div class="error-title">
                    حدث خطأ أثناء تحميل الخدمات
                </div>

                <div>
                    ${escapeHtml(
                        err.message ||
                        String(err)
                    )}
                </div>

            </div>

        `;

    }

}


/* =========================
   RENDER SERVICES
========================= */

function renderServices(services){

    const container =
        document.getElementById(
            "servicesContainer"
        );


    if(!services.length){

        container.innerHTML = `

            <div class="empty">

                لا توجد خدمة بهذا الاسم.

            </div>

        `;

        return;
    }


    container.innerHTML =
        services.map(service => `

            <div
                class="service-card"
                onclick="openService('${escapeJs(service.key)}')"
            >

                <div class="service-icon">

                    <span class="service-emoji">
                        ${service.icon}
                    </span>

                </div>

                <div class="service-name">

                    ${escapeHtml(service.name)}

                </div>

                <div class="service-count">

                    ${service.count} باقة متوفرة

                </div>

            </div>

        `).join("");

}


/* =========================
   OPEN SERVICE
========================= */

function openService(gameKey){

    window.location.href =
        "game.html?g=" +
        encodeURIComponent(gameKey);

}


/* =========================
   SEARCH
========================= */

function searchServices(){

    const input =
        document.getElementById(
            "searchInput"
        );

    const query =
        input.value
        .trim()
        .toLowerCase();


    if(!query){

        renderServices(allServices);

        return;
    }


    const filtered =
        allServices.filter(service =>

            service.name
            .toLowerCase()
            .includes(query)

            ||

            service.key
            .toLowerCase()
            .includes(query)

        );


    renderServices(filtered);

}


/* =========================
   FORMAT UNKNOWN NAME
========================= */

function formatGameName(key){

    return key
        .replace(/[-_]/g," ")
        .replace(/\b\w/g,char =>
            char.toUpperCase()
        );

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================
   ESCAPE JAVASCRIPT
========================= */

function escapeJs(value){

    return String(value)
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'")
        .replace(/"/g,'\\"')
        .replace(/\n/g,"\\n")
        .replace(/\r/g,"\\r");

}


/* =========================
   NAVIGATION
========================= */

function goWallet(){

    window.location.href =
        "wallet.html";

}


function goLogin(){

    window.location.href =
        "login.html";

}


/* =========================
   START
========================= */

loadServices();

</script></body>
